    const r = cv.getBoundingClientRect(), v0 = f.v0 ?? 0, span = (f.v1 ?? f.raw.length) - v0;
    const da = Math.abs(e.clientX - (r.left + (f.a - v0) / span * r.width));
    const db = Math.abs(e.clientX - (r.left + (f.b - v0) / span * r.width));
    return Math.min(da, db) > GRAB ? null : da <= db ? "a" : "b";
  };
  cv.addEventListener("pointerdown", (e) => {
    if (smpBusy || recActive() || e.button !== 0 || !e.isPrimary || end || pan) return;   /* one primary pointer */
    const p = at(e);
    end = near(e);
    if (!end && zoomed()) {
      pan = { x: e.clientX, v0: f.v0 ?? 0, span: (f.v1 ?? f.raw.length) - (f.v0 ?? 0) };
      cv.style.cursor = "grabbing";
      cv.setPointerCapture(e.pointerId);
      return;
    }
    end = end || (Math.abs(p - f.a) <= Math.abs(p - f.b) ? "a" : "b");
    cv.setPointerCapture(e.pointerId);
    cv.dispatchEvent(new PointerEvent("pointermove", e));
  });
  cv.addEventListener("pointermove", (e) => {
    if (pan) {
      const r = cv.getBoundingClientRect();
      const a = Math.round(pan.v0 - (e.clientX - pan.x) / r.width * pan.span);
      f.v0 = Math.max(0, Math.min(f.raw.length - pan.span, a));
      f.v1 = f.v0 + pan.span;
      drawTrim(cv, f);
      return;
    }
    if (!end) {                                     /* hovering: what a press would do */
      cv.style.cursor = near(e) || !zoomed() ? "ew-resize" : "grab";
      return;
    }
    const p = at(e), min = Math.round(SMP.RATE * 0.01);   /* at least 10 ms */
    if (end === "a") f.a = Math.max(0, Math.min(p, f.b - min));
    else f.b = Math.min(f.raw.length, Math.max(p, f.a + min));
    drawTrim(cv, f);
  });
  const done = () => {
    if (pan) {                                      /* the view moved: nothing else changes */
      pan = null;
      cv.style.cursor = "grab";
      return;
    }
    if (!end) return;
    end = null;
    f.s = takeSample(f.raw, f.a, f.b);
    renderSamples();                                /* the length and the slot size change */
  };
  cv.addEventListener("pointerup", done);
  cv.addEventListener("pointercancel", done);
  requestAnimationFrame(() => drawTrim(cv, f));     /* (once it is in the page: its colours) */
  return cv;
}

/* leaving the Samples tab or disconnecting: a recording is stopped (it stays in the draft), the
 * preview stops and its audio context closes */
function samplesLeave() {
  ++recEpoch;
  recStarting = false;
  if (rec) recStop();
  if (previewSrc) try { previewSrc.stop(); } catch (e) { /* already ended */ }
  previewSrc = null;
  if (previewCtx) previewCtx.close().catch(() => {});
  previewCtx = null;
}

/* play the trimmed sample as it will be stored (22050 Hz) */
let previewSrc = null, previewCtx = null;
function preview(f) {
  try {
    if (previewSrc) previewSrc.stop();
    previewCtx = previewCtx || new AudioContext();
    previewCtx.resume().catch(() => {});
    const buf = previewCtx.createBuffer(1, f.s.length, SMP.RATE), ch = buf.getChannelData(0);
    for (let i = 0; i < f.s.length; i++) ch[i] = f.s[i] / 32768;
    previewSrc = previewCtx.createBufferSource();
    previewSrc.buffer = buf;
    previewSrc.connect(previewCtx.destination);
    previewSrc.start();
  } catch (e) { /* no audio output: nothing to play */ }
}

async function addFiles(k, list) {
  const d = smpDraft[k];
  for (const f of list) {
    try {
      const z = await decodeFile(f);
      if (d.files.length >= SMP.MAX_ZONES) break;
      d.files.push(z);
      if (!d.name) d.name = f.name.replace(/\.[^.]*$/, "").toUpperCase().replace(/[^\x20-\x7E]/g, "").slice(0, 8);
    } catch (e) { sayK("smpDecodeFail", `${f.name} (${e.message})`); }
  }
  renderSamples();
}

/* (#35) a kit lane's file, cut to where the sound is (silence before it would be a late hit) */
async function kitFile(k, i, f) {
  const d = smpDraft[k];
  try {
    const z = await decodeFile(f);
    [z.a, z.b] = autoTrim(z.raw, 0.003);
    z.s = takeSample(z.raw, z.a, z.b);
    z.lvl = 1;
    d.kit[i] = z;
    if (!d.name) d.name = "KIT";
  } catch (e) { sayK("smpDecodeFail", `${f.name} (${e.message})`); }
  renderSamples();
}

/* (#21) a sound's LEVEL, REV and DLY: 0..127 inside, % as the unit shows them (params.c F_PCT; every % round trips) */

/* (#21) the slot's sounds on the device (lowest keys first): their keys, LEVEL, REV, DLY; a change goes at once (the

async function smpMixSet(k, i, w, v) {

  mix[i][w] = v;

    const r = parse[CMD.SMP_MIX](await rq(req.smpMix(k, mix)));

function renderSamples() {

    const d = smpDraft[k];

    const file = el("input", { type: "file", accept: ".wav,audio/wav,audio/x-wav,audio/*", multiple: true, hidden: true });
    file.addEventListener("change", () => { addFiles(k, [...file.files]); file.value = ""; });
    const name = el("input", { type: "text", class: "name", maxlength: 8, value: d.name, spellcheck: "false", placeholder: "NAME" });
    name.addEventListener("input", () => {

      if (v !== name.value) name.value = v;
      d.name = v;
    });

    const bytes = draftBytes(d), tooBig = bytes > max;
    const size = el("span", { class: tooBig ? "bad" : "dim",
      text: d.files.length ? `${kib(bytes)} / ${kib(max)} KiB` + (tooBig ? " " + t("smpTooBig") : "") : "" });
    const prog = el("progress", { max: 1, value: 0, hidden: true });
    const kitTog = el("button", { class: "tog", "aria-pressed": String(d.asKit), disabled: smpBusy || recActive(),
      onclick: () => { d.asKit = !d.asKit; renderSamples(); } }, t("drumKit"));   /* ((#35) the files stay in the draft meanwhile) */
    const blk = el("div", { class: "smp", "data-k": k },
      el("div", { class: "head" }, el("b", { text: `USR${k + 1}` }), el("span", { text: status }), bar,
        el("button", { ic: "symbol_trash", disabled: smpBusy || !u.zones, onclick: () => smpErase(k) }, t("erase"))),
      d.asKit ? el("div", { class: "head" }, el("span", { text: t("smpName") }), name, kitTog) :
      el("div", { class: "head" }, el("span", { text: t("smpName") }), name,
        el("button", { ic: "symbol_folder_open", disabled: smpBusy || recActive(), onclick: () => file.click() }, t("chooseFiles")), file,
        el("button", { ic: "symbol_upload", disabled: smpBusy || recActive() || !d.files.length || tooBig || !d.name, onclick: () => smpUpload(k, prog) }, t("upload")),
        d.files.length ? el("button", { text: t("clearList"), disabled: smpBusy || recActive(), onclick: () => { d.files = []; renderSamples(); } }) : "",
        kitTog, size, prog),
      d.asKit ? "" : recRow(k));
    if (u.zones && u.mix && !d.asKit) blk.append(mixTable(k, u));   /* ((#21) the sounds on the device; (#35) DRUM's lanes have LANE MIX instead) */
    if (d.asKit) blk.append(...kitPanel(k, d, tooBig, prog));
    else if (d.files.length) {
      const keys = splitKeys(d.files);
      const mx = mixOn();                           /* ((#21) each file's LEVEL, REV, DLY, sent after the upload) */
      const tb = el("table", {}, el("tr", {}, el("th", { text: t("file") }), el("th", { text: t("root") }),
        el("th", { text: t("keys") }), ...(mx ? MIX_KEYS.map((x) => el("th", { text: t(x) })) : []),
        el("th", { text: t("length") }), el("th")));
      d.files.forEach((f, i) => {
        const root = el("input", { type: "text", class: "root", value: noteName(f.root), spellcheck: "false" });
        root.addEventListener("change", () => {
          const n = parseNote(root.value.trim());
          if (n == null) { root.classList.add("bad"); return; }
          f.root = n;
          renderSamples();
        });
        tb.append(el("tr", {}, el("td", { text: f.fname }), el("td", {}, root),
          el("td", { text: `${noteName(keys[i][0])}–${noteName(keys[i][1])}` }),
          ...(mx ? (f.mix || (f.mix = MIX0.slice())).map((v, w) => el("td", {}, pctInput(v, MIX_KEYS[w], (x) => { f.mix[w] = x; }))) : []),
          el("td", { text: `${(f.s.length / SMP.RATE).toFixed(2)} s` }),
          el("td", {}, el("button", { text: t("remove"), disabled: smpBusy || recActive(), onclick: () => { d.files.splice(i, 1); renderSamples(); } }))));
        if (f.raw)                                  /* the waveform: drag its ends to trim */

            el("td", {},
              el("button", { text: t("preview"), onclick: () => preview(f) }),
              el("button", { text: t("autoTrim"), disabled: smpBusy || recActive(), onclick: () => {
                [f.a, f.b] = autoTrim(f.raw);

/* the device's slots, and (#21) each one's sounds' LEVEL, REV, DLY (u.mix: SMP_MIX's reply) when its firmware has them */
async function smpInfo(d = dev) {
  const si = parse[CMD.SMP_INFO](await sessionRequest(d, req.smpInfo()));
  if (d.info && d.info.skiff & 32)
    for (const [k, u] of si.slots.entries()) {
      if (!u.zones) continue;
      try { u.mix = parse[CMD.SMP_MIX](await sessionRequest(d, req.smpMix(k))); }
      catch (e) { if (e.message === "closed") throw e; }
    }
  d.smp = si;
}

async function smpUpload(k, prog) {
  const d = smpDraft[k];
  let built;
  try { built = buildSlot(d.name, d.asKit ? kitZones(d.kit) : d.files.map((f) => ({ s: f.s, root: f.root, mix: f.mix || MIX0 }))); }
  catch (e) { sayK("smpFail", e.message); return; }
  if (!confirm(t("confirmUpload").replace("{n}", k + 1))) return;
  const { hdr, data } = built;
  const session = dev;
  const releaseBusy = beginBusy();
  smpBusy = true;
  renderSamples();
  prog = $("smpslots").querySelector(`[data-k="${k}"] progress[max="1"]`);
  prog.hidden = false;
  try {
    const t0 = performance.now();
    let r = parse[CMD.SMP_BEGIN](await rq(req.smpBegin(k), { timeout: 1000, retries: 0 }));
    if (r.rc) throw new Error("begin rc " + r.rc);
    for (let off = 0; off < data.length; off += 256) {
      const a = SMP.DATA_OFF + off;
      const w = parse[CMD.SMP_WRITE](await rq(req.smpWrite(k, a, data.subarray(off, off + 256)), { timeout: 1000, retries: 1 }));
      if (w.rc) throw new Error(`write at 0x${a.toString(16)} rc ${w.rc}`);
      prog.value = (off + 256) / data.length;
      sayK("smpUploading", `${k + 1}  ${kib(Math.min(data.length, off + 256))} / ${kib(data.length)} KiB`);
    }
    r = parse[CMD.SMP_END](await rq(req.smpEnd(k, hdr), { timeout: 2000, retries: 0 }));
    if (r.rc) throw new Error(`end rc ${r.rc} (${SMP_RC[r.rc] || "?"})`);
    let note = "";
    if (session.info.skiff & 32) {                  /* ((#21) each sound's LEVEL, REV, DLY, in the slot's order) */
      const mix = built.zones.map((z) => z.mix || MIX0), m = parse[CMD.SMP_MIX](await rq(req.smpMix(k, mix)));
      if (m.rc === 1) throw new Error("mix rc 1");
      if (m.rc === 2 && mix.some((x) => x.join() !== MIX0.join())) note = " · " + t("smpMixTooLong");
    }
    sayK("smpDone", `${k + 1}  ${((performance.now() - t0) / 1000).toFixed(1)} s${note}`);
  } catch (e) {
    if (e.message !== "closed") sayK("smpFail", e.message);
  } finally {
    try { if (session === dev) await smpInfo(session); } catch (e) { /* shown by the next action */ }
    smpBusy = false;
    releaseBusy();
    renderSamples();
  }
}

async function smpErase(k) {
  if (!dev || !confirm(t("confirmErase").replace("{n}", k + 1))) return;
  const session = dev;
  const releaseBusy = beginBusy();
  smpBusy = true;
  renderSamples();
  try {
    const r = parse[CMD.SMP_ERASE](await rq(req.smpErase(k), { timeout: 2500, retries: 0 }));
    if (r.rc) throw new Error("erase rc " + r.rc);
    sayK("smpErased", String(k + 1));
  } catch (e) {
    if (e.message !== "closed") sayK("smpFail", e.message);
  } finally {
    try { if (session === dev) await smpInfo(session); } catch (e) { /* ignore */ }
    smpBusy = false;
    releaseBusy();
    renderSamples();
  }
}

/* ---------------------------------------------------------- mixer (v3) --- */
/* dev.mix = TRACK reply + pan per track ({sel, ntrk, tracks: [{engine, preset, level, mute, armed, pan}]}).
   Read on connect, after every RELOAD / sound change, with the slow safety DUMP and when the tab opens.
   The selected track's level / pan / mute are also Sound parameters: both views follow each other. */
let mixDrag = null;                 /* "lv:i" / "pan:i" while a strip control is dragged */
const mixEdit = new Map();          /* "lv:i" / "pan:i" -> time of the user's last change */
const mixCtl = [];                  /* per track: the strip's elements */
let panning = false;                /* v3 firmware: another track is selected for a moment (pan of a track that is not selected) */
const mixTouched = (kind, i) => mixDrag === `${kind}:${i}` || performance.now() - (mixEdit.get(`${kind}:${i}`) || 0) < 600
  || (!!dev && kind === "lv" && dev.link.hasQueued("mix:" + i))
  || (kind === "pan" && (panWant.has(i) || (!!dev && dev.link.hasQueued("pan:" + i))));
function trackName(x) {
  return [dev.info.engines[x.engine], (dev.names[x.engine] || [])[x.preset]].filter(Boolean).join(" ");
}

async function readMixer(d = dev, full = tab === "tracks") {
  assertSession(d);
  if (!d || !hasTracks()) return;   /* ((Skiff W7) the pans whole only for the Mixer tab: a track's own, no sound load moves one) */
  const m = await mixer.read((r, o) => sessionRequest(d, r, o), d.info, { pan: pPan(), rev: pRev() }, full || !d.mix ? null : d.mix.tracks);
  if (d !== dev) return;
  if (d.mix) m.tracks.forEach((x, i) => {           /* what the user is moving stays */
    const o = d.mix.tracks[i];
    if (!o) return;
    if (mixTouched("lv", i)) { x.level = o.level; x.mute = o.mute; }
    if (mixTouched("pan", i)) x.pan = o.pan;
    if (mixTouched("rev", i)) x.rev = o.rev;
  });
  d.mix = m;
  if (m.sel !== d.sel && !panning) { d.sel = m.sel; needReload = true; }   /* selected on the device, push missed */
  renderMixer();
}

/* the Sound view's values of the selected track -> the strips */
function mixFromDump() {
  if (!dev || !dev.mix || !dev.dump || panning) return;
  const m = dev.mix, x = m.tracks[dev.sel];
  if (x) {
    if (!mixTouched("lv", dev.sel)) {
      x.level = dev.dump.p[P.LEVEL];
      x.mute = dev.dump.p[pMute()] ? 1 : 0;
    }
    if (!mixTouched("pan", dev.sel)) x.pan = dev.dump.p[pPan()];
  }
  if (mixCtl.length === m.ntrk) m.tracks.forEach((_, i) => updateStrip(i));
}
/* a strip's values -> the Sound view (the selected track) */
function mixToSound(i) {
  const x = dev.mix.tracks[i];
  const put = (s, id, v) => { if (v == null) return; (s ? dev.dump.g : dev.dump.p)[id] = v; showValue(key(s, id), v, false); };
  if (i !== dev.sel) return;
  put(0, P.LEVEL, x.level);
  put(0, pMute(), x.mute ? 1 : 0);
  put(0, pPan(), x.pan);
}

function renderMixer() {
  const box = $("mixer");
  if (!dev || !dev.mix) { box.replaceChildren(); mixCtl.length = 0; return; }
  const m = dev.mix;
  if (mixCtl.length !== m.ntrk || box.dataset.lang !== lang) {
    box.dataset.lang = lang;
    mixCtl.length = 0;

/* Patches live in IndexedDB "felucca-editor": store "patches" (by id), store "meta" ("layout": the
   parameter keys / engine names the stored values are in). Without IndexedDB (some private windows)
   the library is kept in memory only. */
const store = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res) => {
    try {
      const r = indexedDB.open("felucca-editor", 1);
      r.onupgradeneeded = () => { r.result.createObjectStore("patches", { keyPath: "id" }); r.result.createObjectStore("meta"); };
      r.onsuccess = () => res(r.result);
      r.onerror = r.onblocked = () => res(null);
    } catch (e) { res(null); }
  }));
  const tx = async (name, mode, fn) => {
    const db = await open();
    if (!db) return undefined;
    return new Promise((res, rej) => {
      const x = db.transaction(name, mode);
      let out;
      const r = fn(x.objectStore(name));
      if (r) r.onsuccess = () => { out = r.result; };
      x.oncomplete = () => res(out);
      x.onerror = x.onabort = () => rej(x.error || new Error("IndexedDB"));
    });
  };
  return {
    ok: async () => !!(await open()),
    all: () => tx("patches", "readonly", (os) => os.getAll()),
    putMany: (ps) => tx("patches", "readwrite", (os) => { ps.forEach((p) => os.put(p)); }),
    del: (id) => tx("patches", "readwrite", (os) => os.delete(id)),
    getMeta: (k) => tx("meta", "readonly", (os) => os.get(k)),
    setMeta: (k, v) => tx("meta", "readwrite", (os) => os.put(v, k)),
  };
})();

  const e = dev.dump.engine, pi = $("preset").value === "" ? dev.dump.preset : +$("preset").value;
  const name = (dev.names[e] || [])[pi] || "PRESET";
  const was = { engine: dev.dump.engine, preset: dev.dump.preset }, keep = (await capturePatch(rqf, dev.info, "")).patch;
  selfLoad(true);
  await rqf(req.preset(e, pi));
  const { patch } = await capturePatch(rqf, dev.info, name);
  patch.pattern = null;
  patch.grid = null;
  patch.tags = ["factory"];
  await rqf(req.preset(was.engine, was.preset));   /* ((Skiff W1) the sound as it was, edits and all: the preset it */
  await auditionPatch(rqf, dev.info, keep, { gEng: gEng(), track: dev.sel ?? 0 });   /* came from, its values over it) */
  await libAdd([patch]);
  await afterSoundChange("ready", d);
  sayK("copiedLib", `${dev.info.engines[e]} ${name}`);
}));

function libPut(id, slot) {
  const p = lib.find((x) => x.id === id);
  if (!p || !dev || !dev.bank || slot == null || libBusy) return;
  const s = dev.bank.slots[slot];
  if (!engineOk(p)) { sayK("badEngine", p.engineName || p.engine); return; }
  if (s.used && !confirm(t("confirmOverwrite").replace("{n}", slotName(slot)).replace("{name}", s.name))) return;
  libOp(async (d, rqf) => {
    const keep4 = p.fm4 && dev.info.engines[1] === "-" && p.fm4.length === dev.info.pcount;   /* a converted DIGITAL sound:
                                                     its DIGITAL values as engine 1 (the device converts them on load) */
    checkRc(await bank.put(rqf, slot, keep4 ? { ...p, engine: 1, name: upName(p.name), p: fullParams({ ...p, p: p.fm4 }) }
      : { ...p, name: upName(p.name), p: fullParams(p) }, dev.info));
    await refreshSlot(slot, d);
    sayK("putDone", `${slotName(slot)} ${upName(p.name)}`);
  });
}
$("libput").addEventListener("click", () => libPut(libSel, bankSel));

$("libren").addEventListener("click", () => {
  const p = lib.find((x) => x.id === libSel);
  if (!p) return;
  const v = prompt(t("promptName"), p.name);
  if (v == null || !v.trim()) return;
  p.name = v.trim().slice(0, 32);
  libUpdate(p);
});
$("libtags").addEventListener("click", () => {
  const p = lib.find((x) => x.id === libSel);
  if (!p) return;
  const v = prompt(t("promptTags"), p.tags.join(", "));
  if (v == null) return;
  p.tags = [...new Set(v.split(",").map((x) => x.trim()).filter(Boolean))];
  libUpdate(p);
});
$("libdup").addEventListener("click", () => {
  const p = lib.find((x) => x.id === libSel);
  if (p) libAdd([{ ...p, name: (p.name + " 2").slice(0, 32), created: nowIso(), modified: nowIso() }]);
});
$("libdel").addEventListener("click", async () => {
  const p = lib.find((x) => x.id === libSel);
  if (!p || !confirm(t("confirmDelete").replace("{name}", p.name))) return;
  lib = lib.filter((x) => x !== p);
  libSel = null;
  try { await store.del(p.id); } catch (e) { console.warn(e); }
  renderLib();
});

function download(name, obj) {
  const blob = new Blob([JSON.stringify(obj, null, 1)], { type: "application/json" });
  const a = el("a", { href: URL.createObjectURL(blob), download: name });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const fileSlug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "patch";
const today = () => new Date().toISOString().slice(0, 10);
$("libexp1").addEventListener("click", () => {
  const p = lib.find((x) => x.id === libSel);
  if (p) download(`felucca-patch-${fileSlug(p.name)}.json`, libraryFile("patch", [p], libCtx()));
});
$("libexport").addEventListener("click", () => download(`felucca-library-${today()}.json`, libraryFile("library", lib, libCtx())));
$("libimport").addEventListener("click", () => { $("libfile").value = ""; $("libfile").click(); });
$("libfile").addEventListener("change", async () => {
  let n = 0, skipped = 0;
  for (const f of [...$("libfile").files]) {
    try {
      const obj = JSON.parse(await f.text());
      const ctx = libCtx();
      const r = readLibraryFile(obj, ctx);
      if (!ctx.keys && r.keys) {                     /* no layout yet: the file's becomes the library's */
        libMeta = { keys: r.keys, engines: Array.isArray(obj.engines) ? obj.engines : null, pe0: obj.pE0 ?? null };
        try { await store.setMeta("layout", libMeta); } catch (e) { console.warn(e); }
      }
      if (obj.kind === "bank") r.patches.forEach((p) => { if (!p.tags.includes("bank")) p.tags.push("bank"); });
      await libAdd(r.patches);
      n += r.patches.length;
      skipped += r.skipped;
    } catch (e) { sayK("badfile", `${f.name}: ${e.message}`); return; }
  }
  sayK("imported", n + (skipped ? t("skippedN").replace("{n}", skipped) : t("patchesN")));
});

/* ((Skiff W6) a list's row from the keyboard: focusable, Space selects it, Enter acts (audition, load), the arrows
   move to the row above / below; rowFocus: the row to focus again after the list is drawn anew */
let rowFocus = null;
function rowKeys(tr, list, key, select, act) {
  tr.tabIndex = 0;
  tr.addEventListener("keydown", (e) => {
    if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      rowFocus = { list, key };
      if (e.key === " ") select(); else act();
    } else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      const n = e.key === "ArrowDown" ? tr.nextElementSibling : tr.previousElementSibling;
      if (n && n.tabIndex === 0) { e.preventDefault(); n.focus(); }
    }
  });
}
function rowRefocus(list, box, attr) {
  if (!rowFocus || rowFocus.list !== list) return;
  const tr = box.querySelector(`tr[${attr}="${CSS.escape(String(rowFocus.key))}"]`);
  rowFocus = null;
  if (tr) tr.focus();
}

/* device bank */
function bankLoad(slot) {
  if (!dev || !dev.bank || slot == null || libBusy) return;
  const s = dev.bank.slots[slot];
  if (s && s.used && lightRefuses(dev.info, dev.sel ?? 0, s.engine)) {   /* ((Skiff W4) refused, said why: the device's */
    sayK("lightRefused", `${dev.info.engines[s.engine]} T${(dev.sel ?? 0) + 1}`);   /* rc is 1 for an empty slot too) */
    return;
  }
  libOp(async (d, rqf) => {
    selfLoad();
    const rc = await bank.load(rqf, slot);
    if (rc) { sayK(s && s.used ? "loadRefused" : "emptySlot", slotName(slot)); return; }
    await afterSoundChange("ready", d);
    sayK("loadedUser", `${slotName(slot)} ${s.name}`);
  });
}
$("bkload").addEventListener("click", () => bankLoad(bankSel));
$("bkstore").addEventListener("click", () => {
  const slot = bankSel;
  if (!dev || !dev.bank || slot == null) return;
  const s = dev.bank.slots[slot];
  const name = prompt(t("promptNameAuto"), s.used ? s.name : "");
  if (name == null) return;
  if (s.used && !confirm(t("confirmOverwrite").replace("{n}", slotName(slot)).replace("{name}", s.name))) return;
  libOp(async (d, rqf) => {
    checkRc(await bank.store(rqf, slot, name.trim()));
    await refreshSlot(slot, d);
    sayK("storedSlot", `${slotName(slot)} ${dev.bank.slots[slot].name}`);
  });
});
function bankGet(slot) {
  if (!dev || !dev.bank || slot == null || libBusy) return;
  libOp(async (d, rqf) => {
    const u = await bank.get(rqf, dev.info, slot);
    if (!u.used) { sayK("emptySlot", slotName(slot)); return; }
    const pt = { name: u.name, engine: u.engine, engineName: dev.info.engines[u.engine], p: u.p, pattern: u.pattern, grid: u.grid, tags: ["device"],
      fm6: u.fm6 };
    await libAdd([reservedFm4(dev.info.engines, u.engine) ? fromDigital(pt, dev.info.engines, dev.info.pe0) : pt]);
    sayK("copiedLib", u.name);
  });
}
$("bkget").addEventListener("click", () => bankGet(bankSel));
$("bkerase").addEventListener("click", () => {
  const slot = bankSel;
  if (!dev || !dev.bank || slot == null) return;
  const s = dev.bank.slots[slot];
  if (!s.used || !confirm(t("confirmEraseSlot").replace("{n}", slotName(slot)).replace("{name}", s.name))) return;
  libOp(async (d, rqf) => {
    checkRc(await bank.erase(rqf, slot));
    await refreshSlot(slot, d);
    sayK("erasedSlot", slotName(slot));
  });
});
$("bkrefresh").addEventListener("click", () => libOp(async (d, rqf) => {
  sayK("readingBank");
  dev.bank = await bank.list(rqf);
  sayK("ready");
}));
$("bkexport").addEventListener("click", () => libOp(async (d, rqf) => {
  const out = [];
  for (const x of dev.bank.slots) {
    if (!x.used) continue;
    sayK("readingBank", ` ${slotName(x.slot)}`);
    const u = await bank.get(rqf, dev.info, x.slot);
    if (u.used) out.push({ name: u.name, engine: u.engine, p: u.p, pattern: u.pattern, grid: u.grid, slot: x.slot, fm6: u.fm6,
      engineName: reservedFm4(dev.info.engines, u.engine) ? "DIGITAL" : dev.info.engines[u.engine] });   /* (DIGITAL's values) */
  }
  download(`felucca-bank-${today()}.json`, libraryFile("bank", out, libCtx()));
  sayK("ready");
}));

/* ------------------------------------------------------------------ FM6 --- */
/* The 6-OP FM tab (firmware with FM6: INFO's fm6 tag): the whole patch of an FM6 track, which the device
   only reaches through its macros. Import the generic 155-byte single-voice and 4096-byte 32-voice SysEx files,
   pick a voice, edit it, send it to a track (live while editing); read a track's patch or a factory one; export a
   voice. The track keeps it (SLOT OWN); a user preset (SAVE) or a project on the device keeps it after that.
   The patch bank of 1.0..1.0.2 (B1..B27) is not offered, whatever the firmware (retired in 1.0.3). */
let fm6v = FM6.init();                 /* the patch being edited (155 bytes) */
let fm6Imported = [];                  /* voices of the last imported file: [{name, v}] */
let fm6Picked = -1;                    /* the imported voice last clicked (now in fm6v) */
let fm6List = null;                    /* FM6_LIST of the device */
let fm6Listing = false;                /* FM6_LIST on its way */
let fm6Asked = false;                  /* FM6_LIST asked once for this connection (renderPanels) */
let fm6Timer = null;
const fm6Ok = () => !!dev && !!dev.info && !!dev.info.fm6;
const fm6Track = () => +$("fm6trk").value || 0;
const fm6SlotName = (i) => "F" + (i + 1);   /* the factory patches */
const FM6_WAVES = ["TRI", "SAW-", "SAW+", "SQR", "SIN", "S&H"];
const FM6_CURVES = ["-LIN", "-EXP", "+EXP", "+LIN"];
function fm6Set(i, val) {
  fm6v[i] = Math.max(0, Math.min(FM6.max(i), Math.round(+val || 0)));
  if ($("fm6live").checked && fm6Ok()) {
    clearTimeout(fm6Timer);
    fm6Timer = setTimeout(() => op(() => fm6Send(true)), 150);
  }
}
function fm6Num(i, title) {
  return el("input", { type: "number", min: 0, max: FM6.max(i), value: fm6v[i], title, class: "fm6n",
    onchange: (e) => { fm6Set(i, e.target.value); e.target.value = fm6v[i]; renderFm6Ops(); } });
}
function fm6Sel(i, names, title) {
  const s = el("select", { title, onchange: (e) => { fm6Set(i, e.target.value); renderFm6(); } },
    ...names.map((n, k) => el("option", { value: k, text: n })));
  s.value = fm6v[i];
  return s;
}
function renderFm6Voice() {
  const V = FM6.VI, alg = fm6v[V.ALG], fb = FM6.feedbackOp(alg);
  const nm = el("input", { type: "text", maxlength: 10, value: FM6.name(fm6v), size: 11,
    onchange: (e) => { FM6.setName(fm6v, e.target.value); fm6Set(0, fm6v[0]); e.target.value = FM6.name(fm6v); } });
  const row = (label, ...kids) => el("tr", {}, el("th", { text: label }), el("td", {}, ...kids));
  $("fm6voice").replaceChildren(el("table", {},
    row(t("name"), nm),
    row("ALG", fm6Sel(V.ALG, Array.from({ length: 32 }, (_, k) => String(k + 1)), "ALG"),
      el("span", { class: "dim", text: ` ${t("fm6Carriers")} ${FM6.carriers(alg).join(" ")}, ${t("fm6Feedback")} OP${fb}` })),
    row("FB", fm6Num(V.FB, "FB"), " OKS ", fm6Num(V.OKS, "OKS"), " TRNSP ", fm6Num(V.TRNSP, "TRNSP")),
    row("LFO", fm6Sel(V.LFW, FM6_WAVES, "WAVE"), " SPD ", fm6Num(V.LFS, "SPEED"), " DLY ", fm6Num(V.LFD, "DELAY"),
      " PMD ", fm6Num(V.LPMD, "PMD"), " AMD ", fm6Num(V.LAMD, "AMD"), " PMS ", fm6Num(V.LPMS, "PMS"), " SYNC ", fm6Num(V.LKS, "SYNC")),
    row(t("fm6PitchEg"), "R ", ...[0, 1, 2, 3].map((k) => fm6Num(V.PR1 + k, "R" + (k + 1))),
      " L ", ...[0, 1, 2, 3].map((k) => fm6Num(V.PL1 + k, "L" + (k + 1))))));
}
function renderFm6Ops() {
  const car = FM6.carriers(fm6v[FM6.VI.ALG]);
  const head = el("tr", {}, el("th", { text: "OP" }), ...FM6.OP.map(([n]) => el("th", { text: n })), el("th", { text: t("fm6Freq") }));
  const rows = [1, 2, 3, 4, 5, 6].map((n) => el("tr", {},
    el("th", { text: (car.includes(n) ? "● " : "") + n }),
    ...FM6.OP.map(([f]) => el("td", {}, f === "LC" || f === "RC" ? fm6Sel(FM6.at(n, f), FM6_CURVES, f)
      : f === "MODE" ? fm6Sel(FM6.at(n, f), ["RATIO", "FIXED"], f) : fm6Num(FM6.at(n, f), `OP${n} ${f}`))),
    el("td", { class: "dim", text: FM6.freqText(fm6v, n) })));
  $("fm6ops").replaceChildren(el("div", { class: "fm6ops" }, el("table", {}, head, ...rows)), el("p", { class: "dim", text: t("fm6Legend") }));
}
function renderFm6Imported() {
  const box = $("fm6imported");
  if (!fm6Imported.length || !fm6Ok()) { box.replaceChildren(); return; }
  box.replaceChildren(el("p", { class: "dim", text: t("fm6Pick") }),
    el("p", { class: "bar" }, ...fm6Imported.map((x, k) => el("button", { text: `${k + 1} ${x.name}`,
      "aria-pressed": k === fm6Picked ? "true" : "false",
      onclick: () => { fm6v = Uint8Array.from(x.v); fm6Picked = k; renderFm6(); sayK("fm6Picked", ` ${x.name}`); } }))));
}
function renderFm6() {
  if (!fm6Ok()) return;
  const ts = $("fm6trk"), keepT = ts.value, ss = $("fm6slot"), keepS = ss.value;
  ts.replaceChildren(...Array.from({ length: dev.info.ntrk || 1 }, (_, i) => el("option", { value: i, text: String(i + 1) })));
  ts.value = keepT || (dev.sel ?? 0);
  const nf = dev.info.fm6.factory;      /* the factory patches only (names once FM6_LIST is in) */
  ss.replaceChildren(...Array.from({ length: nf }, (_, i) => {
    const x = fm6List && fm6List.slots[i];
    return el("option", { value: i, text: `${fm6SlotName(i)} ${x && x.used ? x.name : ""}`.trim() });
  }));
  ss.value = keepS !== "" && +keepS < nf ? keepS : "0";
  renderFm6Voice();
  renderFm6Ops();
  renderFm6Imported();
}
async function fm6Refresh(d = dev) {
  fm6Listing = true;
  try { fm6List = parse[CMD.FM6_LIST](await sessionRequest(d, req.fm6List())); } finally { fm6Listing = false; }
  renderFm6();
}
async function fm6Send(quiet) {
  const r = parse[CMD.FM6_PUT](await sessionRequest(dev, req.fm6Put(FM6.TARGET.TRACK, fm6Track(), FM6.pack(fm6v))));
  checkRc(r.rc);
  if (!quiet) sayK("fm6Sent", ` ${fm6Track() + 1}`);
}
$("fm6read").addEventListener("click", () => op(async () => {
  const r = parse[CMD.FM6_GET](await sessionRequest(dev, req.fm6Get(FM6.TARGET.TRACK, fm6Track())));
  checkRc(r.rc);
  fm6v = FM6.unpack(r.packed);
  renderFm6();
  sayK("fm6Read", ` ${fm6Track() + 1}: ${FM6.name(fm6v)}`);
}));
$("fm6send").addEventListener("click", () => op(() => fm6Send(false)));
$("fm6load").addEventListener("click", () => op(async () => {   /* a factory patch into the editor */
  const i = +$("fm6slot").value;
  const r = parse[CMD.FM6_GET](await sessionRequest(dev, req.fm6Get(FM6.TARGET.FACTORY, i)));
  checkRc(r.rc);
  fm6v = FM6.unpack(r.packed);
  fm6Picked = -1;
  renderFm6();
  sayK("fm6Loaded", ` ${fm6SlotName(i)}: ${FM6.name(fm6v)}`);
}));
$("fm6init").addEventListener("click", () => { fm6v = FM6.init(); renderFm6(); });
$("fm6import").addEventListener("click", () => $("fm6file").click());
$("fm6file").addEventListener("change", async (e) => {
  const f = e.target.files[0];
  e.target.value = "";
  if (!f) return;
  const r = FM6.parseSysex(new Uint8Array(await f.arrayBuffer()));
  if (!r.voices.length) { const [k, x] = fm6Why(r); sayK(k, `${x}: ${f.name}`); return; }
  fm6Imported = r.voices;
  fm6Picked = r.voices.length === 1 ? 0 : -1;
  if (r.voices.length === 1) fm6v = Uint8Array.from(r.voices[0].v);
  renderFm6();
  const notes = [r.badSum && t("fm6BadSum"), r.short && t("fm6Short"), r.skipped && t("fm6Skipped").replace("{x}", r.skipped)].filter(Boolean);
  sayK("imported", `${f.name}: ${r.voices.length}` + (notes.length ? ` (${notes.join(", ")})` : ""));
});
/* why a file had no 6-operator voice: [message key, what to add before the file name] */
function fm6Why(r) {
  const mk = r.kinds.find((k) => k.startsWith("maker:"));
  if (r.kinds.includes("fm4")) return ["fm6Is4op", ""];
  if (r.kinds.includes("other43")) return ["fm6OtherBlocks", ""];
  if (mk) return ["fm6OtherMaker", ` (ID ${mk.slice(6)})`];
  if (r.kinds.includes("universal")) return ["fm6Universal", ""];
  return [r.sysex ? "fm6NoVoice" : "fm6NotSysex", ""];
}
function downloadBytes(name, bytes) {
  const a = el("a", { href: URL.createObjectURL(new Blob([bytes], { type: "application/octet-stream" })), download: name });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$("fm6export").addEventListener("click", () => downloadBytes(`${fileSlug(FM6.name(fm6v))}.syx`, FM6.singleSysex(fm6v)));

$("connect").addEventListener("click", () => {
  if (dev) { wantConnected = false; disconnect(); } else connect();
});
applyLang();
showTab(tab);
libInit();
if (!MOCK && !navigator.requestMIDIAccess) sayK("nomidi");
})();
</script>
