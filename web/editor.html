<!-- Sample input recording and waveform trimming adapted from Andrea (@andreahaku), PR #29.
     Skiff's web editor (after Felucca's). One file, no libraries. Protocol: EDITOR_PROTOCOL.md.
     Add ?mock=1 to the URL to use a built-in simulated device. -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skiff Editor</title>
<style>
  /* Fukiai: Hügelton Instruments' icon font (MIT, FUKIAI-LICENSE.txt). Icons are text in .ic spans;
     they stay hidden until the face has loaded (html.fk), so a missing font never shows boxes. */
  @font-face { font-family: "Fukiai"; src: url("fukiai.ttf") format("truetype"); font-display: block; unicode-range: U+EA00-EB09; }
  /* ((Skiff 1.0) the look is the unit's BLOCKS (design/editor_looks.png A, the user's pick): the night, tiles, white
     values, Barlow Condensed (OFL, fonts/) for headings, labels and values, each track its colour, the sliders in the
     selected track's (--trk: renderTrackbar). Once connected the tokens follow the unit's THEME (renderPreferences:
     SKIFF and HI-CON dark, PAPER light, CRYPT NEON QUARK their own, each with its tracks' colours,
     tools/gen_ui_palettes.py); before that, the system's. Colours only here, as tokens. ((Skiff W6) DIM 4.5:1 and more
     on BG and TILE; LINE, an input's edge, 3:1 and more on TILE) */
  @font-face { font-family: "Barlow Condensed"; src: url("fonts/BarlowCondensed-Medium.ttf") format("truetype"); font-weight: 500;
               font-display: swap; }
  @font-face { font-family: "Barlow Condensed"; src: url("fonts/BarlowCondensed-Bold.ttf") format("truetype"); font-weight: 700;
               font-display: swap; }
  :root { --t1: #ff5a36; --t2: #22c3b4; --t3: #ffbf00; --t4: #9580ff; --t5: #ff6fae; --t6: #a3e635; --trk: var(--t1);
          --on-trk: #111111; --head: var(--fg);
          --bg: #f4efe4; --tile: #e6dfd0; --raise: #d7cdb9; --hover: #c9bea7; --fg: #221e18; --dim: #5f574a; --line: #857a66;
          --rec: #be1828; --txmix: 62%; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0c0c0c; --tile: #1e1e1e; --raise: #2c2c2c; --hover: #3a3a3a; --fg: #ffffff;
      --dim: #8c8c8c; --line: #6e6e6e; --rec: #ff4848; --txmix: 100%; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #0c0c0c; --tile: #1e1e1e; --raise: #2c2c2c; --hover: #3a3a3a; --fg: #ffffff; --dim: #8c8c8c;
    --line: #6e6e6e; --rec: #ff4848; --txmix: 100%; color-scheme: dark; }
  /* (Skiff) the unit's THEME CRYPT: its dark and stone, bone text, amber headings */
  :root[data-theme="crypt"] { --bg: #0a0705; --tile: #221810; --raise: #33251a; --hover: #45321f; --fg: #ecd6ac; --dim: #9a8868;
    --line: #6e5a42; --rec: #e85842; --txmix: 100%; --head: #ffb020; color-scheme: dark;
    --t1: #ec6e32; --t2: #f2b63c; --t3: #decea6; --t4: #e85842; --t5: #acac5c; --t6: #cc86b0; }
  :root[data-theme="crypt"] h1, :root[data-theme="crypt"] h2 { font-family: ui-monospace, Consolas, Menlo, monospace; }
  /* (Skiff) NEON: its night and glass, pink headings glowing */
  :root[data-theme="neon"] { --bg: #0c041a; --tile: #1e0c32; --raise: #2e1650; --hover: #3e2068; --fg: #f4ecff; --dim: #a890cc;
    --line: #7050a0; --rec: #ff4060; --txmix: 100%; --head: #ff58be; color-scheme: dark;
    --t1: #ff40b0; --t2: #30e0ff; --t3: #ffde5a; --t4: #ff8038; --t5: #aa64ff; --t6: #50ffaa; }
  :root[data-theme="neon"] h1, :root[data-theme="neon"] h2 { font-style: italic; text-shadow: 0 0 6px #ff58be88; }
  /* (Skiff) QUARK: a detector's dark, cyan headings on a dotted rule, the colour charges */
  :root[data-theme="quark"] { --bg: #03070c; --tile: #0a1520; --raise: #13243a; --hover: #1d3352; --fg: #d8f3ff; --dim: #7fa6bc;
    --line: #3f6c8c; --rec: #ff5460; --txmix: 100%; --head: #4fd1ff; color-scheme: dark;
    --t1: #ff5460; --t2: #46dc82; --t3: #5a8cff; --t4: #3cdcf0; --t5: #e660e6; --t6: #fadc50; }
  :root[data-theme="quark"] h2 { border-bottom: 1px dotted var(--head); padding-bottom: 3px; }
  html { color-scheme: light dark; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
         font-variant-numeric: tabular-nums; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
  h2 { font-size: 13px; font-weight: 600; margin: 0 0 4px; padding-bottom: 2px; border-bottom: 1px solid var(--fg); }
  h3 { font-size: 11px; font-weight: 400; color: var(--dim); margin: 4px 0 0; }
  a { color: inherit; }
  .lang { float: right; font-size: 12px; color: var(--dim); text-decoration: underline; background: none; padding: 0; }
  button { font: inherit; background: var(--fg); color: var(--bg); border: 0; padding: 2px 10px; cursor: pointer; }
  button:disabled { opacity: .3; cursor: default; }
  button.lang { color: var(--dim); background: none; }
  select, input[type=text], input[type=number], input[type=search] {
    font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); padding: 1px 3px; border-radius: 0; }
  input[type=range] { width: 100%; margin: 0; accent-color: var(--fg); }
  input[type=checkbox] { accent-color: var(--fg); margin: 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin: 0 0 8px; }
  .dim { color: var(--dim); }
  #status { min-height: 1.4em; }
  section { margin: 12px 0; }
  .groups { columns: 250px; column-gap: 20px; }
  .group { break-inside: avoid; margin: 0 0 12px; }
  .row { display: grid; grid-template-columns: 66px 1fr 70px; gap: 6px; align-items: center; min-height: 22px; }
  .row.kitrow { grid-template-columns: 52px 1fr 30px 1fr 30px; }   /* ((Skiff W3) the DRUM-X kit: A beside B) */
  .row .v { text-align: right; white-space: nowrap; }
  .row select { width: 100%; }
  .browser { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  .browser select[size] { min-width: 150px; }
  .slots { display: grid; grid-template-columns: auto auto auto auto; gap: 3px 8px; align-items: center; justify-content: start; }
  .slots.named { grid-template-columns: auto auto auto auto auto; }   /* ((Skiff W3) RENAME too) */
  /* ((Skiff W3) the Song tab: an entry, a pattern: the one a track is on filled, the one staged dashed, the one picked
     ringed; empty dim; a pattern nothing uses dashed and dim) */
  .lists td { padding: 2px 1px; }   /* ((2.0, #44, the chain sheet's A) round its tile: a chain's box, its tiles on it, the
                                       track's colour dimmed, as on the device; two side by side, a notch between them) */
  .lists td.chain { background: color-mix(in srgb, var(--s, var(--fg)) 35%, var(--tile)); }
  .lists td.cp { box-shadow: inset 2px 0 var(--tile); }
  .lists td.cn { box-shadow: inset -2px 0 var(--tile); }
  .lists button, .pool button { min-width: 2.6em; padding: 1px 2px; background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    font-variant-numeric: tabular-nums; }
  .lists button.on, .pool button.on { background: var(--fg); color: var(--bg); }
  .lists button.next, .lists button.tog.next { outline: 2px dashed var(--fg); outline-offset: -4px; }
  .lists button.pick, .pool button.pick { box-shadow: 0 0 0 2px var(--fg); }
  .lists button.empty, .pool button.empty, .seg button.empty { color: var(--dim); }
  .lists button.snd { clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%); }   /* ((2.0, #30) an entry
                                                 with a sound: its corner cut, as on the device) */
  .pool button.unused { color: var(--dim); border-style: dashed; }
  .lists sub { font-size: 70%; }
  .pool { display: grid; grid-template-columns: repeat(8, 2.8em); gap: 3px; }
  .seg button.kept { font-weight: 700; }
  table { border-collapse: collapse; }
  th { font-weight: 400; color: var(--dim); text-align: left; padding: 0 6px 2px 0; }
  td { padding: 1px 6px 1px 0; }
  td.i { color: var(--dim); text-align: right; }
  #steps input[type=text] { width: 120px; }
  #steps input[type=number] { width: 48px; }
  #steps .bad { outline: 1px solid var(--fg); text-decoration: underline wavy; }
  .fm6ops { overflow-x: auto; }
  .fm6ops td, .fm6ops th { padding: 0 2px; }
  input.fm6n { width: 3.2em; }
  #steps tr.off td { color: var(--dim); }
  .stepcols { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px 24px; }   /* ((1.3.1) the 16-step tables
                                                    side by side where they fit, else one under another: CSS columns of
                                                    470 px overlapped tables grown to ~790 px with FLAM, COND, NUDGE) */
  .stepcols table { flex: none; }
  @media (max-width: 600px) {
    .stepcols { overflow-x: auto; }
    #steps input[type=text] { width: 84px; }
    #steps input[type=number] { width: 42px; }
    #steps th, #steps td { padding-right: 3px; }
  }
  .smp { margin: 0 0 14px; padding: 6px 0 0; border-top: 1px solid var(--line); }
  .smp.over { outline: 1px solid var(--fg); outline-offset: 2px; }
  .smp .head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
  .smp .head b { font-weight: 600; min-width: 40px; }
  .smp canvas.trim { width: 100%; height: 56px; display: block; touch-action: none; cursor: ew-resize; }
  .smp progress.rec { width: 120px; }
  .smp progress { width: 160px; height: 6px; accent-color: var(--fg); }
  .smp table { margin: 4px 0; }
  .smp input.name { width: 80px; text-transform: uppercase; }
  .smp input.root { width: 48px; }
  .smp input.pct { width: 52px; }
  .smp .bad { text-decoration: underline wavy; }
  /* (#35) DRUM KIT: a row a lane, its file (a drop target) and its level; one upload */
  .smp .kit { display: grid; grid-template-columns: auto minmax(0, 1fr) 120px auto; gap: 6px 12px; align-items: center;
              max-width: 600px; margin: 6px 0; }
  .smp .kit > b { font: 500 15px "Barlow Condensed", sans-serif; letter-spacing: .03em; }
  .smp button.kitf { text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .smp button.kitf.empty { background: none; border: 1px dashed var(--line); color: var(--dim); }
  .smp button.kitf.over { outline: 1px solid var(--fg); }
  .smp .kitlen { display: flex; gap: 12px; align-items: center; max-width: 600px; }
  .smp .kitlen progress { flex: 1; width: auto; }
  .smp button.go { background: var(--fg); color: var(--bg); margin: 8px 0 4px; }
  footer { margin-top: 24px; font-size: 11px; color: var(--dim); }
  .row.pushed .v { font-weight: 600; }
  .row.modrow { grid-template-columns: 16px 1fr 1fr 1fr 52px; }
  /* librarian: local library and the device's user bank side by side, stacked on a phone */
  .libcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 8px 24px; margin-top: 6px; }
  .libcols > div { min-width: 0; }
  .libcols .bar input[type=search] { flex: 1 1 120px; min-width: 0; }
  .list { height: 260px; overflow: auto; border: 1px solid var(--line); resize: vertical; }
  .list table { width: 100%; table-layout: fixed; }
  .list th { position: sticky; top: 0; background: var(--bg); padding: 1px 6px; }
  .list td { padding: 1px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list tr[data-id], .list tr[data-slot] { cursor: pointer; }
  .list tr.sel td { background: var(--fg); color: var(--bg); }
  .list tr.empty td { color: var(--dim); }
  .list tr.over td { outline: 1px dashed var(--fg); outline-offset: -1px; }
  .list.over { outline: 1px solid var(--fg); }
  .list .none { padding: 6px; color: var(--dim); }
  .list col.n { width: 40px; } .list col.e { width: 72px; } .list col.d { width: 78px; }
  .ic { font-family: "Fukiai"; font-style: normal; font-weight: 400; font-synthesis: none; line-height: 1; margin-right: .3em; }
  html:not(.fk) .ic { display: none; }
  /* wave choices: a page-drawn picker so the options can carry an icon (Chrome 135+); native menus get words only */
  @supports (appearance: base-select) {
    select.wave, select.wave::picker(select) { appearance: base-select; }
    select.wave { padding: 1px 3px; min-block-size: 0; border: 1px solid var(--line); border-radius: 0; background: var(--bg); color: var(--fg); }
    select.wave > button { font: inherit; background: none; color: inherit; padding: 0; text-align: start; }
    select.wave::picker(select) { border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 0; }
    select.wave option { padding: 1px 6px; min-block-size: 0; }
    select.wave option:checked { font-weight: 600; }
    select.wave option:hover, select.wave option:focus-visible { background: var(--fg); color: var(--bg); }
    select.wave option::checkmark { display: none; }
  }
  /* tabs: a wrapping row of plain buttons, the open one inverted; header stays at the top on wide screens */
  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 4px 0 0; }
  @media (max-width: 600px) { .top { position: static; } }
  .tabs { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--fg); margin: 6px 0 0; }
  .tabs button { background: none; color: var(--dim); padding: 4px 10px; border: 1px solid transparent; border-bottom: 0; white-space: nowrap; }
  .tabs button:hover { color: var(--fg); }
  .tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); }
  .trackbar { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .seg { display: inline-flex; flex-wrap: wrap; }
  .seg button, button.tog { background: var(--bg); color: var(--fg); border: 1px solid var(--fg); padding: 1px 10px; }
  .seg button + button { border-left: 0; }
  .seg button[aria-pressed="true"], button.tog[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .panel { margin: 12px 0; }
  .hint { margin: 16px 0; color: var(--dim); }
  /* sequencer: a step grid over the selected track (16 per row, 8 on a phone) */
  .grid { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 2px; margin: 6px 0 12px; }
  @media (max-width: 600px) { .grid { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
  .grid button { background: var(--bg); color: var(--fg); border: 1px solid var(--line); padding: 2px; min-width: 0; height: 52px;
                 display: flex; flex-direction: column; justify-content: flex-start; gap: 1px; text-align: left; overflow: hidden; font-size: 10px; line-height: 1.15; }
  .grid button .n { color: var(--dim); }
  .grid button .x { overflow: hidden; overflow-wrap: anywhere; flex: 1; }
  .grid button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .grid button.on .n { color: inherit; opacity: .6; }
  .grid button.acc .x { font-weight: 700; }
  .grid button.tie { border-style: dashed; border-color: var(--fg); }
  .grid button.beat { border-left-color: var(--fg); }
  #steps tr.hl td { outline: 1px solid var(--fg); }
  /* mixer: a channel strip per track (six; Skiff phase 6) as on the device's MIXER page */
  .mixer { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; max-width: 900px; margin: 6px 0; }
  @media (max-width: 600px) { .mixer { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .strip { border: 1px solid var(--line); padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .strip.sel { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
  .strip .num { font-size: 18px; font-weight: 600; line-height: 1; }
  .strip .snd { font-size: 11px; line-height: 1.3; width: 100%; text-align: center; overflow-wrap: anywhere; min-height: 2.6em; }
  .strip .rec { font-size: 11px; color: var(--dim); }
  .strip .rec.on { color: var(--fg); font-weight: 600; }
  .strip .rec:not(.on) .ic { visibility: hidden; }
  .strip input.fader { writing-mode: vertical-lr; direction: rtl; width: 28px; height: 150px; }
  .strip .v { font-size: 11px; white-space: nowrap; }
  .strip .pan { width: 100%; }
  .strip.muted .fader, .strip.muted .lv { opacity: .35; }
  .strip button { width: 100%; padding: 1px 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip button.selb:disabled { opacity: 1; background: none; color: var(--dim); }
  #sysinfo th { padding-right: 16px; }
  /* ((Skiff 1.0) BLOCKS over the rules above: tiles, Barlow Condensed, the tracks' colours (--s: the track's own) */
  h1 { font: 700 26px "Barlow Condensed", sans-serif; letter-spacing: .02em; text-transform: uppercase; color: var(--head); }
  h2 { font: 700 16px "Barlow Condensed", sans-serif; letter-spacing: .04em; text-transform: uppercase; border: 0; margin: 0 0 6px;
       color: var(--head); }
  h3 { font: 500 12px "Barlow Condensed", sans-serif; letter-spacing: .05em; text-transform: uppercase; }
  .group { background: var(--tile); border-radius: 6px; padding: 10px 12px 8px; }
  .row > span:first-child { font: 500 14px "Barlow Condensed", sans-serif; letter-spacing: .03em; }
  .row .v { font: 700 15px "Barlow Condensed", sans-serif; }
  button { background: var(--raise); color: var(--fg); border-radius: 4px; padding: 3px 10px; }
  button:hover:not(:disabled) { background: var(--hover); }
  button.lang, button.lang:hover:not(:disabled) { background: none; }
  select, input[type=text], input[type=number], input[type=search] { background: var(--raise); border: 1px solid var(--line);
    border-radius: 4px; padding: 2px 4px; }
  input[type=range], input[type=checkbox], .smp progress { accent-color: var(--trk); }
  .tabs { border-bottom: 2px solid var(--fg); gap: 2px; }
  .tabs button { font: 700 15px "Barlow Condensed", sans-serif; letter-spacing: .04em; text-transform: uppercase; background: var(--tile);
    color: var(--dim); border: 0; border-radius: 6px 6px 0 0; padding: 5px 12px; }
  .tabs button:hover:not(:disabled) { background: var(--raise); color: var(--fg); }
  .tabs button[aria-selected="true"], .tabs button[aria-selected="true"]:hover { background: var(--fg); color: var(--bg); }
  .seg button, button.tog { background: var(--raise); border: 0; margin-right: 2px; border-radius: 4px; }
  .seg button + button { border-left: 0; }
  .seg button[aria-pressed="true"], button.tog[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  #trackbtns button:nth-child(1), .mixer .strip:nth-child(1), .lists tbody tr:nth-child(1) { --s: var(--t1); }
  #trackbtns button:nth-child(2), .mixer .strip:nth-child(2), .lists tbody tr:nth-child(2) { --s: var(--t2); }
  #trackbtns button:nth-child(3), .mixer .strip:nth-child(3), .lists tbody tr:nth-child(3) { --s: var(--t3); }
  #trackbtns button:nth-child(4), .mixer .strip:nth-child(4), .lists tbody tr:nth-child(4) { --s: var(--t4); }
  #trackbtns button:nth-child(5), .mixer .strip:nth-child(5), .lists tbody tr:nth-child(5) { --s: var(--t5); }
  #trackbtns button:nth-child(6), .mixer .strip:nth-child(6), .lists tbody tr:nth-child(6) { --s: var(--t6); }
  #trackbtns button, .lists tbody th, .strip .num { color: color-mix(in srgb, var(--s) var(--txmix), var(--fg)); }
  #trackbtns button { font: 700 16px "Barlow Condensed", sans-serif; min-width: 32px; }
  #trackbtns button[aria-pressed="true"] { background: var(--s); color: var(--on-trk); }
  .strip { background: var(--tile); border: 0; border-radius: 6px; }
  .strip.sel { box-shadow: inset 0 0 0 2px var(--s); }
  .strip .num { font: 700 26px "Barlow Condensed", sans-serif; background: none; }
  .strip .num[aria-pressed="true"] { background: var(--s); color: var(--on-trk); }   /* (selected: as the track bar's) */
  .strip input[type=range] { accent-color: var(--s); }
  .grid button.on { background: var(--trk); border-color: var(--trk); color: var(--on-trk); }
  .lists tbody th { font: 700 15px "Barlow Condensed", sans-serif; }
  .lists button, .pool button { background: var(--raise); border-color: var(--raise); border-radius: 3px; }
  .lists button.empty, .pool button.empty { background: var(--tile); border-color: var(--tile); }
  .lists button.on { background: var(--s); border-color: var(--s); color: var(--on-trk); }
  .lists button.next { outline-color: var(--s); }
  #trec[aria-pressed="true"] { background: var(--rec); color: var(--on-trk); }
  .list tr.sel td { background: var(--trk); color: var(--on-trk); }
  /* (Skiff #27) THEME CUSTOM: the colour wells, each role under its well */
  .wells { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
  .wells label { display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--dim); }
  .wells input[type=color] { width: 34px; height: 26px; padding: 0; border: 1px solid var(--line); background: none; }
  .wellbox { margin-top: 10px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <button class="lang" id="lang"></button>
  <h1>Skiff Editor</h1>
  <p class="dim"><a href="../installer/" style="color:inherit" data-t="installer"></a></p>
  <!-- always visible: connection, version, sync mode, the tabs and (Sound / Sequencer / Tracks) the track selector -->
  <header class="top">

<script>
"use strict";
/*PROTO-BEGIN*/
/* ---------------------------------------------------------------- protocol --- */
const HDR = [0x7D, 0x46, 0x4C];
const CMD = { INFO: 1, GET: 2, SET: 3, DUMP: 4, DESC: 5, STEP_GET: 6, STEP_SET: 7, PRESET: 8, PROJECT: 9, NAMES: 10,
  SMP_BEGIN: 11, SMP_WRITE: 12, SMP_END: 13, SMP_ERASE: 14, SMP_INFO: 15,
  UP_LIST: 16, UP_GET: 17, UP_PUT: 18, UP_STORE: 19, UP_LOAD: 20, UP_ERASE: 21,
  WATCH: 22, CHANGED: 23, RELOAD: 24, PING: 25, STEP_CHANGED: 26,
  TRACK: 27, TRACK_MIX: 28, TRACK_DUMP: 29, TRACK_STEP: 30,
  TRACK_PARAM: 31, TRACK_CHANGED: 32, SONG: 33,
  UI_STATE: 34, UI_SET: 35, UI_PALETTES: 36, FAV_GET: 37, FAV_SET: 38, COLORS: 39,
  MOTION: 64, BACKUP_LIST: 65, BACKUP_GET: 66, BACKUP_PUT: 67,
  FM6_GET: 68, FM6_PUT: 69, FM6_LIST: 70, FM6_ERASE: 71, MENU_DESC: 72, MENU_SET: 73, KIT_GET: 74, KIT_PUT: 75, TRANSPORT: 76, PROJ_NAME: 77, POOL: 78, LIST: 79, PERFORM: 80,
  SMP_MIX: 81, LIST2: 82 };
/* frames the device sends on its own (while WATCH is on); never replies */
const PUSH = new Set([CMD.CHANGED, CMD.RELOAD, CMD.STEP_CHANGED, CMD.TRACK_CHANGED]);
/* user preset bank: name 1..12 printable ASCII, a 16-step pattern of (note, flags 1 acc 2 slide 4 tie) */
const UP = { NAME_MAX: 12, PAT: 16, LIST_MAX: 16 };
const PAT_REST = 65;                              /* (#28) LIST: an entry that is a REST (patterns 1..64, 0 empty) */
const F = { INT: 0, PCT: 1, BIPCT: 2, TIME: 3, LFOHZ: 4, CUTOFF: 5, DB: 6, SEMI: 7, ENUM: 8, BPM: 9, NOTE: 10, ONOFF: 11, OCT: 12, STEPS: 13, ST16: 14 };
/* (Skiff #27) THEME CUSTOM: the colours a set holds (COLORS, cmd 39), each theme's own to start from (tools/gen_ui_palettes.py:
   BG SURF TEXT THEME ACCENT, then the six tracks', RGB565; test_web.mjs checks them against build/gen/ui_palettes.h), the
   tokens the editor wears while CUSTOM is in use, and the contrast it warns by (WCAG; below the generator's minimums, so
   no theme of the device's warns). After Felucca 1.6's custom palette (palette.js, Leo Kuroshita) */
const PAL_ROLES = ["BG", "SURF", "TEXT", "THEME", "ACCENT", "T1", "T2", "T3", "T4", "T5", "T6"];
const PAL_BUILTIN = [
  ["SKIFF", 0x0841, 0x18c3, 0xffdf, 0xffdf, 0xffdf, 0xfac6, 0x2616, 0xfde0, 0x941f, 0xfb75, 0xa726],
  ["HI-CON", 0x0000, 0x2945, 0xffdf, 0xff40, 0x073f, 0xff40, 0xff40, 0xff40, 0xff40, 0xff40, 0xff40],
  ["PAPER", 0xf77c, 0xe6d9, 0x20e3, 0x0aa8, 0xa9c1, 0x0aa8, 0x0aa8, 0x0aa8, 0x0aa8, 0x0aa8, 0x0aa8],
  ["CRYPT", 0x0820, 0x20c2, 0xeeb5, 0xfd84, 0xfeef, 0xeb66, 0xf5a7, 0xde74, 0xeac8, 0xad6b, 0xcc36],
  ["NEON", 0x0823, 0x1866, 0xf77f, 0xfad7, 0x371f, 0xfa16, 0x371f, 0xfeeb, 0xfc07, 0xab3f, 0x57f5],
  ["QUARK", 0x0021, 0x08a4, 0xdf9f, 0x4e9f, 0xff0c, 0xfaac, 0x46f0, 0x5c7f, 0x3efe, 0xe31c, 0xfeea],
].map(([name, ...c]) => ({ name, c }));
const rgb8 = (c) => [(c >> 11) * 255 / 31 | 0, ((c >> 5) & 63) * 255 / 63 | 0, (c & 31) * 255 / 31 | 0];   /* (as the generator's) */
const hex565 = (c) => "#" + rgb8(c).map((x) => x.toString(16).padStart(2, "0")).join("");
const from565hex = (s) => {
  const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(String(s));
  return m ? (parseInt(m[1], 16) >> 3) << 11 | (parseInt(m[2], 16) >> 2) << 5 | parseInt(m[3], 16) >> 3 : 0;
};
/* gfx.c ux_mix: a + (b - a) * pct / 100 per channel, rounded half away from zero; ux_luma: 0..255 */
const mix565 = (a, b, pct) => [[11, 31], [5, 63], [0, 31]].reduce((o, [sh, mk]) => {
  const x = (a >> sh) & mk, d = (((b >> sh) & mk) - x) * pct;
  return o | (x + Math.trunc((d + (d >= 0 ? 50 : -50)) / 100)) << sh;
}, 0);
const luma565 = (c) => { const [r, g, b] = rgb8(c); return (r * 54 + g * 183 + b * 19) >> 8; };
const contrast565 = (a, b) => {
  const lum = (c) => rgb8(c).map((v) => (v /= 255) <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4)
    .reduce((s, v, i) => s + v * [0.2126, 0.7152, 0.0722][i], 0);
  const x = lum(a), y = lum(b);
  return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
};
/* [role, on role, the least contrast]: words, values and curves, the one active thing, a lane (and its number on it) */
const PAL_RULE = [[2, 0, 4.5], [2, 1, 4.5], [3, 0, 3], [4, 0, 3], ...[5, 6, 7, 8, 9, 10].map((k) => [k, 0, 3])];   /* (symmetric) */
const colorWarnings = (c) => PAL_RULE.map(([a, b, min]) => ({ a: PAL_ROLES[a], b: PAL_ROLES[b], r: contrast565(c[a], c[b]), min }))
  .filter((x) => x.r < x.min);
/* the editor in THEME CUSTOM: its tokens from the set (as the device derives its own: MID and DIM from BG to TEXT, a
   raised tile SURF to TEXT); the look's faces stay data-theme's */
const customTokens = (c) => {
  const light = luma565(c[0]) > 128;
  return { "--bg": hex565(c[0]), "--tile": hex565(c[1]), "--raise": hex565(mix565(c[1], c[2], 8)),
    "--hover": hex565(mix565(c[1], c[2], 16)), "--fg": hex565(c[2]), "--dim": hex565(mix565(c[0], c[2], 62)),
    "--line": hex565(mix565(c[0], c[2], 42)), "--head": hex565(c[3]), "--on-trk": hex565(c[0]),
    "--txmix": light ? "62%" : "100%", "color-scheme": light ? "light" : "dark",
    ...Object.fromEntries([1, 2, 3, 4, 5, 6].map((k) => [`--t${k}`, hex565(c[4 + k])])) };
};

const v14enc = (v) => { const u = Math.max(-8192, Math.min(8191, Math.round(v))) + 8192; return [u & 0x7F, (u >> 7) & 0x7F]; };
const v14dec = (lo, hi) => (lo | (hi << 7)) - 8192;
function strEnc(s) { const a = []; for (const c of String(s)) a.push(c.charCodeAt(0) & 0x7F); a.push(0); return a; }

/* only ever builds F0 7D 46 4C ... F7 */
function frame(cmd, args = []) {
  for (const b of args) if (!(Number.isInteger(b) && b >= 0 && b <= 0x7F)) throw new Error("bad data byte " + b);
  return [0xF0, ...HDR, cmd & 0x7F, ...args, 0xF7];
}
/* -> {cmd, a} or null when it is not an editor frame */
function unframe(d) {
  if (!d || d.length < 6 || d[0] !== 0xF0 || d[d.length - 1] !== 0xF7) return null;
  if (d[1] !== HDR[0] || d[2] !== HDR[1] || d[3] !== HDR[2]) return null;
  return { cmd: d[4], a: Array.from(d.slice(5, d.length - 1)) };
}

/* the DRUM grid (firmware v5): a step's lane hits and their accents, bit l = lane l. Each lane plays its GM note
   (eng_drum.c DRUM_LANE_NOTE) on any engine; LANE_OF: the lane a GM note 35..81 strikes (drum_lane; others fold
   to their octave of 36..47) */
const LANES = ["KICK", "SNARE", "CLAP", "HATCL", "HATOP", "TOM", "RIM", "BELL"];
const LANE_NOTE = [36, 38, 39, 42, 46, 45, 37, 56];
const LANE_OF = "00612153535455757773777675555555773366336665577";
const LANE_ALIAS = { CONGA: 5, CLAVE: 6, CYM: 7, BD: 0, SD: 1, CP: 2, CH: 3, OH: 4 };
const drumLane = (n) => +LANE_OF[(n >= 35 && n <= 81 ? n : 36 + ((n + 120 - 36) % 12)) - 35];
/* the lanes a step strikes (its hits, its notes on their lanes) and which are accented (step_lanes / step_accents) */
const stepLanes = (s) => (s.time !== 0 ? 0 : s.notes.slice(0, s.n).reduce((m, n) => m | (1 << drumLane(n)), s.hit | 0));
const stepAccents = (s) => (s.flags & 1 ? stepLanes(s) : (s.acc | 0) & stepLanes(s));
/* hits as text, an accent marked ">" ("KICK >SNARE HATCL"), and back: null when a word is not a lane */
const hitsText = (hit, acc) => LANES.map((nm, l) => (hit >> l & 1 ? (acc >> l & 1 ? ">" : "") + nm : "")).filter(Boolean).join(" ");
function parseHits(text) {
  let hit = 0, acc = 0;
  for (const w of String(text).toUpperCase().split(/[\s,]+/).filter(Boolean)) {
    const a = w.startsWith(">"), nm = a ? w.slice(1) : w, l = LANES.includes(nm) ? LANES.indexOf(nm) : LANE_ALIAS[nm];
    if (l == null) return null;
    hit |= 1 << l;
    if (a) acc |= 1 << l;
  }
  return { hit, acc };
}
/* the 3 bytes after a step (v5): hit & 127, acc & 127, bit 7 of each; an older firmware's step has none (0) */
const hitsEnc = (hit, acc) => [hit & 0x7F, acc & 0x7F, (hit >> 7 & 1) | (acc >> 7 & 1) << 1];
/* (Skiff W3) the mock device's MENU settings, as Skiff's firmware has them (menu_items.c; test_web.mjs checks them against
   tests/editor_test.c's menu.json): id, name, value names (THEME: the palettes), default, the device's tab */
const MENU_TABS = ["DISPLAY", "CONTROL", "AUDIO", "SYSTEM"];
const MENU = [
  { id: 0, name: "THEME", names: null, def: 0, tab: 0 }, { id: 2, name: "LARGE", names: ["OFF", "ON"], def: 0, tab: 0 },
  { id: 3, name: "ANIM", names: ["ON", "OFF"], def: 0, tab: 0 }, { id: 4, name: "LEDS", names: ["OFF", "DIM LO", "DIM HI", "INV"], def: 2, tab: 0 },
  { id: 5, name: "HOLD", names: ["0.3 s", "0.4 s", "0.5 s", "0.6 s"], def: 1, tab: 1 }, { id: 6, name: "KNOB ACCEL", names: ["OFF", "ON"], def: 0, tab: 1 },
  { id: 8, name: "BPM LOCK", names: ["OFF", "ON"], def: 0, tab: 1 }, { id: 9, name: "SPEAKER EQ", names: ["FLAT", "LOWCUT", "BASS+"], def: 0, tab: 2 },
  { id: 10, name: "USB LEVEL", names: ["MASTER", "FIXED"], def: 0, tab: 2 }, { id: 11, name: "USB SERIAL", names: ["ON", "OFF"], def: 0, tab: 3 },

/* ((2.0, #30) a Song tab reply (request r) as device d sends it: LIST2's with each entry's sound when INFO 58 01 has bit 1) */
const songReply = (d, r, a) => (r[0] === CMD.LIST2 ? parse[CMD.LIST2](a, !!(d.info.song2 & 2)) : parse[r[0]](a));

/* a name the device accepts: printable ASCII, 1..12 characters */

function cleanProjName(s) { return String(s ?? "").toUpperCase().replace(/[^\x20-\x7E]/g, "").trim().slice(0, 12); }

   so: the editor keeps scope 0 and the whole id */

  favSet: (engine, preset, on) => [CMD.FAV_SET, [engine, ...v14enc(preset), on ? 1 : 0]],

  set: (scope, id, v) => [CMD.SET, [...widOut(scope, id), ...v14enc(v)]],

  desc: (scope, id) => [CMD.DESC, widOut(scope, id)],

      ...(st.hit == null && st.chance == null ? [] : hitsEnc(st.hit | 0, st.acc | 0)),
      ...(st.chance == null ? [] : [Math.max(0, Math.min(100, st.chance | 0))]),

/* (Skiff W3) the device's MENU settings, each as MENU_DESC describes it (none asked of firmware without them) */
async function readDeviceMenu(rq, info) {
  const items = [];
  for (let i = 0; i < (info.menuCount | 0); i++) {
    const d = parse[CMD.MENU_DESC](await rq(req.menuDesc(i)));
    if (d.id === 127) break;
    items.push(d);
  }
  return items;

/* which reply belongs to which request (the device echoes these) */
function replyMatches(cmd, args, a) {
  switch (cmd) {
    case CMD.MOTION: return a[0] === args[0];
    case CMD.MENU_DESC: return a[0] === args[0];
    case CMD.MENU_SET: return a[1] === args[0];
    case CMD.KIT_GET: case CMD.KIT_PUT: return a[0] === args[0];
    case CMD.PROJ_NAME: case CMD.POOL: case CMD.LIST: case CMD.LIST2: case CMD.PERFORM: return a[0] === (args[0] || 0);
    case CMD.BACKUP_GET: return a[0] === args[0] && a.slice(2, 7).every((v, i) => v === args[i + 1]);
    case CMD.BACKUP_PUT: return a[0] === args[0] && a[1] === args[1];
    case CMD.UI_SET: return a[1] === args[0] && a[2] === args[1];
    case CMD.FAV_GET: case CMD.FAV_SET:
      return ![0, 3, 4].includes(a[0]) || (a[1] === args[0] && a[2] === args[1] && a[3] === args[2] && a[4] === args[3]);
    case CMD.GET: case CMD.SET: case CMD.DESC: return a[0] === args[0] && a[1] === args[1];
    case CMD.STEP_GET: case CMD.STEP_SET: case CMD.NAMES:
    case CMD.SMP_BEGIN: case CMD.SMP_END: case CMD.SMP_ERASE: case CMD.SMP_MIX: return a[0] === args[0];
    case CMD.SMP_WRITE: return a[0] === args[0] && a[1] === args[1] && a[2] === args[2] && a[3] === args[3];
    case CMD.SONG: return a[0] === args[0];
    case CMD.FM6_GET: case CMD.FM6_PUT: return a[0] === args[0] && a[1] === args[1];
    case CMD.FM6_ERASE: return a[0] === args[0];
    case CMD.PROJECT: return a[0] === args[0] && a[1] === args[1];
    case CMD.UP_LIST: case CMD.UP_GET: case CMD.UP_PUT: case CMD.UP_STORE: case CMD.UP_LOAD: case CMD.UP_ERASE:
    case CMD.TRACK_MIX: case CMD.TRACK_DUMP: return a[0] === args[0];
    case CMD.WATCH: return (a[0] & 1) === (args[0] & 1);   /* bit 1: v4 firmware only */
    case CMD.TRACK_STEP: case CMD.TRACK_PARAM: return a[0] === args[0] && a[1] === args[1];
    default: return true;

}

/* strict request/response: one frame in flight, the rest queued. Push frames (CHANGED, RELOAD,
   STEP_CHANGED) can come at any time, also between a request and its reply: they go to onPush. */
/* (2.0.1, #50) the ports a unit may be on, as the installer finds them (fm1ota.js find): an input and an output of the
   same name, connected, the name one a unit can have (macOS can give its port a generic name: the installer found the
   unit, the editor looked for "Felucca" only). "Felucca" first; connect() takes the first pair that answers INFO */
const UNIT_PORT = /fm-1|smk|elite|mke-p37|starry|felucca|composite|sinco|usb-midi/i;
function portPairs(access) {
  const outs = [...access.outputs.values()], pairs = [];
  for (const i of access.inputs.values()) {
    if (i.state === "disconnected" || !UNIT_PORT.test(i.name || "")) continue;
    const o = outs.find((x) => x.name === i.name && x.state !== "disconnected");
    if (o) pairs.push([i, o]);
  }
  return pairs.sort((a, b) => /felucca/i.test(b[0].name) - /felucca/i.test(a[0].name));
}

class Link {
  constructor(send, opts = {}) {
    this.sendRaw = send;
    this.q = [];
    this.cur = null;
    this.closed = false;
    this.lastSent = 0;                              /* Date.now() of the last frame sent (WATCH keep-alive) */
    this.timeout = opts.timeout || 300;
    this.onUnknown = opts.onUnknown || (() => {});
    this.onTimeout = opts.onTimeout || (() => {});
    this.onPush = opts.onPush || (() => {});
    this.onGap = opts.onGap || (() => {});         /* (ms) nothing was sent for that long (WATCH may have ended) */
  }
  get idle() { return !this.cur && !this.q.length; }
  hasQueued(key) { return this.q.some((r) => r.key === key); }
  /* r = [cmd, args]; opt: {timeout, retries, key (coalesce queued requests: the latest args win), front,
     quiet (a timeout is expected: no onTimeout)} */
  request(r, opt = {}) {
    if (this.closed) return Promise.reject(new Error("closed"));
    const [cmd, args] = r;
    if (opt.key) {
      const old = this.q.find((x) => x.key === opt.key);
      if (old) { old.cmd = cmd; old.args = args; return old.promise; }
    }
    let res, rej;
    const promise = new Promise((a, b) => { res = a; rej = b; });
    const item = { cmd, args, key: opt.key, res, rej, promise, quiet: !!opt.quiet,
      timeout: opt.timeout || this.timeout, retries: opt.retries ?? 1 };
    if (opt.front) this.q.unshift(item); else this.q.push(item);
    this.pump();
    return promise;
  }
  pump() {
    if (this.cur || this.closed || !this.q.length) return;
    this.cur = this.q.shift();
    this.fire();
  }
  fire() {
    const c = this.cur;
    const now = Date.now();
    if (this.lastSent && now - this.lastSent > 2500) this.onGap(now - this.lastSent);
    this.lastSent = now;
    try { this.sendRaw(frame(c.cmd, c.args)); } catch (e) { this.finish(null, e); return; }
    c.timer = setTimeout(() => {
      if (this.cur !== c) return;
      if (c.retries-- > 0) { this.fire(); return; }
      if (!c.quiet) this.onTimeout(c.cmd);
      this.finish(null, new Error("timeout (cmd " + c.cmd + ")"));
    }, c.timeout);
  }
  finish(val, err) {
    const c = this.cur;
    if (!c) return;
    clearTimeout(c.timer);
    this.cur = null;
    if (err) c.rej(err); else c.res(val);
    this.pump();
  }
  /* raw incoming MIDI bytes */
  receive(data) {
    const f = unframe(data);
    if (!f) return;                                  /* not ours (notes, clock, other SysEx) */
    if (PUSH.has(f.cmd)) { this.onPush(f); return; }
    const c = this.cur;
    if (!c || f.cmd !== c.cmd || !replyMatches(c.cmd, c.args, f.a)) { this.onUnknown(f); return; }
    this.finish(f.a);
  }
  close() {
    this.closed = true;
    const all = (this.cur ? [this.cur] : []).concat(this.q);
    if (this.cur) clearTimeout(this.cur.timer);
    this.cur = null;
    this.q = [];
    for (const r of all) r.rej(new Error("closed"));
  }
}

/* ------------------------------------------------------------- formatting --- */
const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const noteName = (n) => NOTE_NAMES[n % 12] + (Math.floor(n / 12) - 1);   /* 60 = C4 */
/* a note token: a number or a note name (C4, F#3, Bb2) */
function parseNote(tok) {
  if (/^\d+$/.test(tok)) { const n = +tok; return n <= 127 ? n : null; }
  const m = /^([A-Ga-g])([#b]?)(-?\d)$/.exec(tok);

  4026, 4428, 4871, 5358, 5894, 6484, 7132, 7845, 8630, 9493, 10442, 11487, 12635, 13899, 15289, 16818,

  const now = new Date().toISOString();
  const pat = Array.isArray(pt.pattern) && pt.pattern.length
    ? Array.from({ length: UP.PAT }, (_, i) => { const x = pt.pattern[i]; return Array.isArray(x) ? patNorm(x[0] | 0, x[1] | 0) : [0, 0]; })
    : null;
  const grid = Array.isArray(pt.grid) && pt.grid.length
    ? Array.from({ length: UP.PAT }, (_, i) => { const x = pt.grid[i]; const h = Array.isArray(x) ? x[0] & 255 : 0; return [h, Array.isArray(x) ? x[1] & h : 0]; })
    : null;
  const o = {
    name: String(pt.name ?? "PATCH").slice(0, 32) || "PATCH",
    engine: pt.engine | 0, engineName: String(pt.engineName ?? ""),
    p: Array.from(pt.p || pt.params || [], (v) => (Number.isFinite(v) ? Math.round(v) : null)),
    pattern: patternUsed(grid) ? null : patternUsed(pat) ? pat : null,
    grid: patternUsed(grid) ? grid : null,
    tags: Array.isArray(pt.tags) ? [...new Set(pt.tags.map((x) => String(x).trim()).filter(Boolean))] : [],
    created: pt.created || now, modified: pt.modified || pt.created || now,
  };
  if (Number.isInteger(pt.slot)) o.slot = pt.slot;
  if (Array.isArray(pt.fm6) && pt.fm6.length === FM6.PACKED) o.fm6 = pt.fm6.map((x) => (x | 0) & 127);   /* (a converted */
  if (Array.isArray(pt.fm4)) o.fm4 = pt.fm4.map((v) => (Number.isFinite(v) ? Math.round(v) : null));    /* DIGITAL sound) */
  return o;
}

/* ctx: {keys, engines, firmware, pe0} of the library (the device's when connected) */
function libraryFile(kind, patches, ctx) {
  return {
    format: LIB.FORMAT, version: LIB.VERSION, kind, firmware: ctx.firmware || "",
    pCount: ctx.keys ? ctx.keys.length : 0, pE0: ctx.pe0 ?? null, paramLabels: ctx.keys || [], engines: ctx.engines || [],
    exported: new Date().toISOString(),
    patches: patches.map((x) => {
      const c = cleanPatch(x);
      const o = { name: c.name, engine: c.engine, engineName: c.engineName || (ctx.engines || [])[c.engine] || "",
        params: c.p, pattern: c.pattern, tags: c.tags, created: c.created, modified: c.modified };
      if (c.grid) o.grid = c.grid;
      if (c.fm6) { o.fm6 = c.fm6; if (c.fm4) o.fm4 = c.fm4; }   /* an FM6 sound's own patch (a DIGITAL sound converted: and
                                                         the DIGITAL values) */
      if (Number.isInteger(x.slot)) o.slot = x.slot;
      return o;
    }),
  };
}
/* -> {patches, skipped, keys (the file's, for a library that has none yet)}; throws on a file it cannot read.
   A DIGITAL patch (the engine retired in 1.0) where ctx has no DIGITAL imports as FM6 (fromDigital); a SAMPLE PERC
   one (the set retired after 1.0.2) as DRUM's kit (fromPerc) */
function readLibraryFile(obj, ctx) {
  if (!obj || typeof obj !== "object") throw new Error("not JSON");
  const noFm4 = !(ctx.engines || []).includes("DIGITAL");
  const perc = (pt, pe0) => (pt && fromPerc(pt, ctx.engines, pe0)) || pt;
  const fm4 = (pt, nm, pe0) => (nm === "DIGITAL" && noFm4 ? fromDigital(pt, ctx.engines, pe0) : perc(pt, pe0));
  const engIndex = (name, idx, fileEngines) => {
    const nm = name || (fileEngines || [])[idx];
    if (ctx.engines && ctx.engines.length) {
      if (nm) return ctx.engines.indexOf(nm);
      return idx < ctx.engines.length ? idx : -1;
    }
    return idx;
  };
  if (obj.format === "felucca-patch") {               /* "Save to file": the whole current sound */
    if (!Array.isArray(obj.p) || !Number.isInteger(obj.engine)) throw new Error("felucca-patch without engine / p");
    const digital = obj.engineName === "DIGITAL" && noFm4;
    const e = digital ? 1 : engIndex(obj.engineName, obj.engine);
    if (e < 0) return { patches: [], skipped: 1, keys: null };
    const p = ctx.keys && ctx.pe0 && obj.p.length !== ctx.keys.length ? tailParams(obj.p, ctx.keys.length, ctx.pe0)
      : obj.p.slice(0, ctx.keys ? ctx.keys.length : obj.p.length);
    const pt = fm4({ name: obj.presetName || obj.engineName || "PATCH", engine: e, engineName: obj.engineName, p,
      pattern: Array.isArray(obj.steps) ? patternFromSteps(obj.steps) : null, tags: ["file"] }, obj.engineName,
      ctx.keys && ctx.pe0 ? ctx.pe0 : p.length - 8);
    return pt ? { patches: [cleanPatch(pt)], skipped: 0, keys: null } : { patches: [], skipped: 1, keys: null };
  }
  if (obj.format !== LIB.FORMAT) throw new Error("unknown format");
  if (!(obj.version >= 1)) throw new Error("version");
  if (!Array.isArray(obj.patches)) throw new Error("no patches");
  const fileKeys = legacyKeys(Array.isArray(obj.paramLabels) && obj.paramLabels.length ? obj.paramLabels.map(String) : null,
    ctx.keys);   /* ((Skiff U4) a file of before U4's words: its keys by id) */
  const out = [];
  let skipped = 0;
  for (const x of obj.patches) {
    if (!x || !Array.isArray(x.params)) { skipped++; continue; }
    const nm = x.engineName || (obj.engines || [])[x.engine | 0];
    const digital = nm === "DIGITAL" && noFm4;
    const e = digital ? 1 : engIndex(x.engineName, x.engine | 0, obj.engines);
    if (e < 0) { skipped++; continue; }
    const p = remapParams(x.params, fileKeys, ctx.keys, ctx.pe0);
    const pe0 = ctx.keys && ctx.pe0 ? ctx.pe0 : obj.pE0 ?? p.length - 8;
    const pt = digital ? fromDigital({ ...x, engine: e, p }, ctx.engines, pe0)
      : perc(cleanPatch({ ...x, engine: e, engineName: (ctx.engines || [])[e] || x.engineName || (obj.engines || [])[x.engine], p }), pe0);
    if (!pt) { skipped++; continue; }
    out.push(cleanPatch(pt));
  }
  return { patches: out, skipped, keys: fileKeys };
}

/* device side; rq(r, opt) -> reply args (Link.request), info from INFO */
const FLASH_OPT = { timeout: 2500, retries: 0 };
const presetPatches = (info) => !!(info && info.fm6 && info.fm6.caps & 2);   /* user presets carry FM6 patches (1.0.3) */
const bank = {
  async list(rq) {
    const first = parse[CMD.UP_LIST](await rq(req.upList(0, UP.LIST_MAX)));
    const slots = first.slots.slice();
    while (slots.length < first.total) {
      const r = parse[CMD.UP_LIST](await rq(req.upList(slots.length, Math.min(UP.LIST_MAX, first.total - slots.length))));
      if (!r.count) break;
      slots.push(...r.slots);
    }
    return { total: first.total, slots };
  },
  /* an FM6 sound's own patch comes with it (fm6: packed) where the firmware keeps one (INFO fm6.caps bit 1) */
  async get(rq, info, slot) {
    const u = parse[CMD.UP_GET](await rq(req.upGet(slot)), info);
    if (u.used && presetPatches(info) && info.engines[u.engine] === "FM6") {
      const g = parse[CMD.FM6_GET](await rq(req.fm6Get(FM6.TARGET.USER, slot)));
      if (!g.rc) u.fm6 = g.packed;
    }
    return u;
  },
  /* -> rc (0 ok); with info, an FM6 sound's patch (pt.fm6) goes with it */
  async put(rq, slot, pt, info) {
    const rc = parse[CMD.UP_PUT](await rq(req.upPut(slot, pt), FLASH_OPT)).rc;
    if (rc || !pt.fm6 || !presetPatches(info) || info.engines[pt.engine] !== "FM6") return rc;
    return parse[CMD.FM6_PUT](await rq(req.fm6Put(FM6.TARGET.USER, slot, pt.fm6), FLASH_OPT)).rc;
  },
  async store(rq, slot, name) { return parse[CMD.UP_STORE](await rq(req.upStore(slot, name), FLASH_OPT)).rc; },
  async load(rq, slot) { return parse[CMD.UP_LOAD](await rq(req.upLoad(slot), { timeout: 1000 })).rc; },
  async erase(rq, slot) { return parse[CMD.UP_ERASE](await rq(req.upErase(slot), FLASH_OPT)).rc; },
};

/* the current sound: DUMP + the first 16 steps */
async function capturePatch(rq, info, name) {
  const dump = parse[CMD.DUMP](await rq(req.dump()), info);
  const steps = [];
  for (let i = 0; i < UP.PAT && i < info.nstep; i++) steps.push(parse[CMD.STEP_GET](await rq(req.stepGet(i))));
  const drum = ["DRUM", "DRUM-X"].includes(info.engines[dump.engine]);   /* (a kit's track that strikes a lane: its grid) */
  let fm6 = null;                                      /* an FM6 track: its own patch (the selected track's) */
  if (info.fm6 && info.engines[dump.engine] === "FM6") {
    const sel = info.ntrk ? parse[CMD.TRACK](await rq(req.track())).sel : 0;
    const g = parse[CMD.FM6_GET](await rq(req.fm6Get(FM6.TARGET.TRACK, sel)));
    if (!g.rc) fm6 = g.packed;
  }
  return { patch: cleanPatch({ name, engine: dump.engine, engineName: info.engines[dump.engine], p: dump.p, pattern: patternFromSteps(steps),
    grid: drum ? gridFromSteps(steps) : null, fm6 }), dump, steps };
}

/* the track's own parameters, which no sound load changes (ui.c param_kept): LEVEL, the ARP and ARP 2 pages,
   SCL, LEN DIV SWING GATE (17..32), PAN, MUTE, the SLICER (45..48); with P_E0 83 the chord keys CHRD VOIC (81, 82:
   E0 E1 of the 89-parameter firmware) */
const TRACK_OWN = new Set([0, 39, 40, ...Array.from({ length: 16 }, (_, i) => 17 + i), 45, 46, 47, 48]);
const P_CHORD = [81, 82];                          /* core.h P_CHRD, P_VOIC (since P_COUNT 91, P_E0 83) */
const P_LANES = [83, 84, 85, 86, 87, 88, 89, 90];   /* core.h P_LN0..P_LN7: the DRUM lane levels (since P_COUNT 99, P_E0 91) */
const P_DIR = 91;                                  /* (Skiff) core.h P_DIR: the play direction, the track's (P_COUNT 100, P_E0 92) */
const P_DUCK = [92, 93, 94];                       /* (Skiff) core.h P_DKSRC P_DKAMT P_DKREL: the ducking, the track's (P_COUNT 103, P_E0 95) */
/* (Skiff phase 9, P_COUNT 125, P_E0 117) core.h P_DTYPE P_DTONE (FX > DRIVE), P_EG2_ATK .. REL (ENV 2), P_LTUNE0..7 and
   P_LDECAY0..7 (the DRUM lanes' TUNE and DECAY): sound parameters, as the engine's */
const P_DRIVE = [95, 96], P_ENV2 = [97, 98, 99, 100];
const P_LTUNE = Array.from({ length: 8 }, (_, i) => 101 + i), P_LDECAY = Array.from({ length: 8 }, (_, i) => 109 + i);
/* (Skiff 1.3, P_COUNT 135, P_E0 127: wide ids) core.h P_LSYNC P_LTRIG P_LPOL (LFO 2), P_SPRD (SPREAD), P_ITYPE P_IA P_IB P_IC
   P_IMIX (FX > INSERT), P_ESYNC (ENV SYNC): sound parameters, as the engine's */
const P_LFO2 = [117, 118, 119], P_SPRD = 120, P_INSERT = [121, 122, 123, 124], P_IMIX = 125, P_ESYNC = 126;
const P_LPAN = Array.from({ length: 8 }, (_, i) => 127 + i);   /* (2.0, #36, P_COUNT 143, P_E0 135) core.h P_LPAN0..7: the
                                                   DRUM lanes' PAN, sound parameters as the lane levels */
const trackOwn = (i, pe0) => TRACK_OWN.has(i) || (pe0 >= 83 && P_CHORD.includes(i)) || (pe0 >= 92 && i === P_DIR) ||
  (pe0 >= 95 && P_DUCK.includes(i));
/* play a patch without writing flash, as UP_LOAD would load it: the sound only. SET the engine (G_ENGSEL:
   engine defaults and its first preset), then every instrument parameter that differs, except the track's
   own (TRACK_OWN). The steps are never touched. The device keeps a copy of the sound from before (SAVE held
   there = undo) and treats the SETs right after G_ENGSEL as part of this load (EDITOR_PROTOCOL.md "undo").
   opt: {gEng: G_ENGSEL id, progress(i, n)} */
/* (Skiff phase 6, W4) whether track `tr` may not play engine `e` (INFO 54 01: the light tracks, the engines they may not) */
function lightRefuses(info, tr, e) {
  const l = info && info.light;
  return !!l && ((l.tracks >> (tr | 0)) & 1) === 1 && ((l.engines >> (e | 0)) & 1) === 1;
}
async function auditionPatch(rq, info, pt, opt = {}) {
  if (lightRefuses(info, opt.track ?? 0, pt.engine))   /* ((Skiff W4) refused before anything is written) */
    throw new Error(`${info.engines[pt.engine] || pt.engine}: not on T${(opt.track ?? 0) + 1} (a light track)`);
  await rq(req.set(1, opt.gEng ?? 20, pt.engine));
  const dump = parse[CMD.DUMP](await rq(req.dump()), info);
  const n = Math.min(info.pcount, pt.p.length);
  for (let i = 0; i < n; i++) {
    const v = pt.p[i];
    if (opt.progress) opt.progress(i, n);
    if (v == null || v === dump.p[i] || trackOwn(i, info.pe0)) continue;
    await rq(req.set(0, i, v));
  }
  if (pt.fm6 && info.fm6)                         /* a converted DIGITAL sound: its own FM6 patch on the track */
    await rq(req.fm6Put(FM6.TARGET.TRACK, opt.track ?? 0, pt.fm6));
  return {};
}

/* WATCH on (asking for TRACK_CHANGED too): false when the firmware does not know it (older than protocol v2),
   else 1, or 3 when it also has TRACK_PARAM / TRACK_CHANGED (protocol v4) */
async function startWatch(rq) {
  try { const on = parse[CMD.WATCH](await rq(req.watch(3), { timeout: 300, retries: 1, quiet: true })).on; return on & 1 ? on & 3 : false; }
  catch (e) { if (e.message === "closed") throw e; return false; }
}

/* ------------------------------------------------------------ mixer (v3) --- */
/* The TRACKS page in the editor: TRACK (engine, preset, level, mute, armed of every track) and TRACK_DUMP
   of each track for its P_PAN. Level and mute go through TRACK_MIX (any track). Pan: TRACK_PARAM (v4, any track); with v3 firmware a plain SET, which reaches only the
   selected track: another track is selected for it and the selection is put back (TRACK pushes no
   RELOAD). ids: {pan: P_PAN id} */
const mixer = {
  async read(rq, info, ids, prev = null) {   /* prev: the tracks as last read: their pans kept, no TRACK_DUMP ((Skiff W7)) */
    const tr = parse[CMD.TRACK](await rq(req.track()));
    for (let i = 0; i < tr.ntrk; i++) {
      if (prev && prev[i]) { tr.tracks[i].pan = prev[i].pan; tr.tracks[i].rev = prev[i].rev ?? null; continue; }
      const d = parse[CMD.TRACK_DUMP](await rq(req.trackDump(i)), info);
      tr.tracks[i].pan = ids.pan == null ? null : d.p[ids.pan];
      tr.tracks[i].rev = ids.rev == null ? null : d.p[ids.rev];   /* ((Skiff W3) REV, the device's MIXER's too) */
    }
    return tr;
  },
  /* -> {track, level, mute} as the device has them now */
  async setMix(rq, track, level, mute, opt) { return parse[CMD.TRACK_MIX](await rq(req.trackMix(track, level, mute), opt)); },
  /* -> the pan value after clamping. v4: TRACK_PARAM, the selection stays */
  async setPan(rq, track, sel, panId, v, v4, key = "pan:" + track) {   /* ((Skiff W3) REV too: its id, its key) */
    if (v4) return parse[CMD.TRACK_PARAM](await rq(req.trackParam(track, panId, v), { key })).value;
    if (track === sel) return parse[CMD.SET](await rq(req.set(0, panId, v))).value;
    await rq(req.track(track));
    try { return parse[CMD.SET](await rq(req.set(0, panId, v))).value; }
    finally { await rq(req.track(sel)).catch(() => {}); }
  },
};

/* ------------------------------------------------------------ mock device --- */
/* Implements the protocol like firmware/src/editor.c, with tables copied from params.c
   and the engine sources (test_web.mjs checks them against the firmware's, tests/descdump.c). Used with ?mock=1 (add &legacy=1 for a firmware without cmds 16..26).
   opt: {legacy: no user bank / WATCH, v3: no TRACK_PARAM / TRACK_CHANGED (firmware 0.8),
         auto: false = no simulated knobs (tests drive sim.*),
         watchMs: how long WATCH lasts after the last request (3000), slots: user bank size (32)} */
/* ------------------------------------------------------------------- FM6 --- */
/* The FM6 engine's patches (eng_fm6.c, EDITOR_PROTOCOL.md "FM6 patches"): the generic 6-operator voice.
   voice: 155 bytes, 6 x 21 operator bytes (the sixth operator first, as the format has them), then 19 voice bytes
   and a 10-character name. packed: the 128-byte record of a 32-voice bank (every byte 7-bit). SysEx files: a
   single voice (F0 43 0n 00 01 1B, 155 bytes, checksum, F7: 163 bytes) or 32 packed voices (F0 43 0n 09 20 00,
   4096 bytes, checksum, F7: 4104 bytes); parseSysex also reads the variants real files have (see there). */
const FM6 = (() => {
  /* per operator byte: name, highest value; then the voice bytes */
  const OP = [["R1", 99], ["R2", 99], ["R3", 99], ["R4", 99], ["L1", 99], ["L2", 99], ["L3", 99], ["L4", 99],
    ["BP", 99], ["LD", 99], ["RD", 99], ["LC", 3], ["RC", 3], ["RS", 7], ["AMS", 3], ["KVS", 7], ["OL", 99],
    ["MODE", 1], ["FC", 31], ["FF", 99], ["DET", 14]];
  const VOICE = [["PR1", 99], ["PR2", 99], ["PR3", 99], ["PR4", 99], ["PL1", 99], ["PL2", 99], ["PL3", 99], ["PL4", 99],
    ["ALG", 31], ["FB", 7], ["OKS", 1], ["LFS", 99], ["LFD", 99], ["LPMD", 99], ["LAMD", 99], ["LKS", 1], ["LFW", 5],
    ["LPMS", 7], ["TRNSP", 48]];
  const OPI = Object.fromEntries(OP.map(([n], i) => [n, i])), VI = Object.fromEntries(VOICE.map(([n], i) => [n, 126 + i]));
  const NAME = 145, SIZE = 155, PACKED = 128;
  const max = (i) => (i < 126 ? OP[i % 21][1] : i < NAME ? VOICE[i - 126][1] : 126);
  /* byte i of operator n (1..6) */
  const at = (n, field) => (6 - n) * 21 + OPI[field];
  function sanitize(v) {
    const o = Uint8Array.from(v.slice(0, SIZE));
    for (let i = 0; i < SIZE; i++) o[i] = i >= NAME ? (o[i] < 32 || o[i] > 126 ? 32 : o[i]) : Math.min(o[i], max(i));
    return o;
  }
  function unpack(b) {                            /* eng_fm6.c fm6_unpack */
    const v = new Uint8Array(SIZE);
    for (let k = 0; k < 6; k++) {
      const o = k * 17, d = k * 21;
      for (let i = 0; i < 11; i++) v[d + i] = b[o + i] & 127;
      v[d + 11] = b[o + 11] & 3; v[d + 12] = b[o + 11] >> 2 & 3; v[d + 13] = b[o + 12] & 7; v[d + 20] = b[o + 12] >> 3 & 15;
      v[d + 14] = b[o + 13] & 3; v[d + 15] = b[o + 13] >> 2 & 7; v[d + 16] = b[o + 14] & 127; v[d + 17] = b[o + 15] & 1;
      v[d + 18] = b[o + 15] >> 1 & 31; v[d + 19] = b[o + 16] & 127;
    }
    for (let i = 0; i < 9; i++) v[126 + i] = b[102 + i] & 127;
    v[134] &= 31; v[135] = b[111] & 7; v[136] = b[111] >> 3 & 1;
    for (let i = 0; i < 4; i++) v[137 + i] = b[112 + i] & 127;
    v[141] = b[116] & 1; v[142] = b[116] >> 1 & 7; v[143] = b[116] >> 4 & 7; v[144] = b[117] & 127;
    for (let i = 0; i < 10; i++) v[NAME + i] = b[118 + i] & 127;
    return sanitize(v);
  }
  function pack(v) {                              /* eng_fm6.c fm6_pack */
    const b = new Array(PACKED).fill(0);
    for (let k = 0; k < 6; k++) {
      const o = k * 17, d = k * 21;
      for (let i = 0; i < 11; i++) b[o + i] = v[d + i] & 127;
      b[o + 11] = (v[d + 11] & 3) | (v[d + 12] & 3) << 2; b[o + 12] = (v[d + 13] & 7) | (v[d + 20] & 15) << 3;
      b[o + 13] = (v[d + 14] & 3) | (v[d + 15] & 7) << 2; b[o + 14] = v[d + 16] & 127;
      b[o + 15] = (v[d + 17] & 1) | (v[d + 18] & 31) << 1; b[o + 16] = v[d + 19] & 127;
    }
    for (let i = 0; i < 9; i++) b[102 + i] = v[126 + i] & 127;
    b[110] &= 31; b[111] = (v[135] & 7) | (v[136] & 1) << 3;
    for (let i = 0; i < 4; i++) b[112 + i] = v[137 + i] & 127;
    b[116] = (v[141] & 1) | (v[142] & 7) << 1 | (v[143] & 7) << 4; b[117] = v[144] & 127;
    for (let i = 0; i < 10; i++) b[118 + i] = v[NAME + i] & 127;
    return b;
  }
  const name = (v) => String.fromCharCode(...v.slice(NAME, NAME + 10)).replace(/\s+$/, "");
  function setName(v, s) {
    const t = String(s).toUpperCase().replace(/[^\x20-\x7E]/g, " ").slice(0, 10).padEnd(10, " ");
    for (let i = 0; i < 10; i++) v[NAME + i] = t.charCodeAt(i);
    return v;
  }
  const checksum = (a) => (128 - (a.reduce((s, x) => s + x, 0) & 127)) & 127;
  /* every voice in a file's bytes, tolerant of what real files have:
     - SysEx F0 43 0n 00 xx xx (one voice, 155 bytes) and F0 43 0n 09 xx xx (32 packed voices, 4096 bytes): the byte
       count is not checked (some tools write 09 10 00, i.e. 0x1000 as two plain bytes); the payload is taken right
       after the 6-byte header whatever follows it: a checksum or not, F7 or not, a stray byte, the next F0;
       a message cut short (EOF, or a byte >= 0x80 inside it) keeps its whole voices (the name may be cut: blanks);
     - several messages in one file, junk before / between / after them;
     - the format's other blocks (manufacturer 43h: supplements, performances, 4-operator voices, universal "LM  ..." blocks) and other
       makers' messages are skipped and counted;
     - raw data without SysEx: 4096 x n bytes (banks), 155 (one voice) or 128 bytes (one packed voice).
     -> {voices: [{name, v}], badSum: messages with a wrong checksum (still read), short: messages cut short,
         skipped: other messages, kinds: what the skipped ones were ("fm4" 4-operator voices, "other43" the format's other
         blocks, "universal", "maker:XX" another manufacturer id), sysex: F0 seen} */
  function parseSysex(bytes) {
    const d = Uint8Array.from(bytes), voices = [], kinds = [];
    let badSum = 0, short = 0, skipped = 0;
    const add = (v) => voices.push({ v, name: name(v) });
    const kind = (k) => { skipped++; if (!kinds.includes(k)) kinds.push(k); };
    const sysex = d.includes(0xF0);
    if (d[0] !== 0xF0 && !sysex) {
      if (d.length && d.length % 4096 === 0) {
        for (let o = 0; o < d.length; o += 128) add(unpack(d.subarray(o, o + 128)));
      } else if (d.length === SIZE) add(sanitize(d));
      else if (d.length === PACKED) add(unpack(d));
      return { voices, badSum, short, skipped, kinds, sysex };
    }
    for (let i = 0; i < d.length; i++) {
      if (d[i] !== 0xF0) continue;
      const id = d[i + 1], st = d[i + 2], f = d[i + 3];
      if (id === 0x43 && st !== undefined && (st & 0xF0) === 0 && (f === 0 || f === 9) && i + 6 <= d.length) {
        const want = f === 0 ? SIZE : 4096, s = i + 6;
        let e = s;
        while (e < d.length && e < s + want && d[e] < 0x80) e++;

/* -------------------------------------------------------------- MIDI --- */
let connecting = false;
async function connect() {
  if (connecting || dev) return;
  connecting = true;
  let connectedDevice = null;
  wantConnected = true;
  if (!MOCK && !navigator.requestMIDIAccess) { connecting = false; sayK("nomidi"); return; }
  $("connect").disabled = true;
  sayK("connecting");
  try {
    if (!access) {
      if (MOCK) { mock = makeMockDevice({ legacy: QS.get("legacy") === "1" }); access = mock.access; }
      else {
        try { access = await navigator.requestMIDIAccess({ sysex: true }); }
        catch (e) { sayK("denied"); return; }
      }
      access.onstatechange = onState;
    }
    const pairs = portPairs(access);
    let input = null, output = null, link = null;
    for (const [i, o] of pairs) {                   /* ((2.0.1, #50) one pair: as before (load asks INFO); more: the
                                                     * first that answers INFO, as the installer's handshake) */
      const l = new Link((d) => o.send(d), {
        timeout: 300,
        onUnknown: (f) => console.debug("ignored reply", f),
        onTimeout: () => sayK("noreply"),
        onPush: (f) => onPush(f),
        onGap: () => { rewatch = true; },
      });
      i.onmidimessage = (e) => l.receive(e.data);
      if (i.open) await i.open().catch(() => {});
      if (pairs.length === 1 || await l.request(req.info(), { timeout: 500, retries: 2, quiet: true }).then(() => true, () => false)) {
        [input, output, link] = [i, o, l];
        break;
      }
      l.closed = true;
      i.onmidimessage = null;
    }
    if (!link) { sayK("nodevice"); return; }
    dev = { link, input, output, info: null, pdesc: [], gdesc: [], names: [], dump: null, steps: [], slotUsed: [null, null, null, null],
      keys: null, watch: false, bank: null };
    connectedDevice = dev;
    setLabel($("connect"), t("disconnect"));
    await load(connectedDevice);
  } catch (e) {
    console.error(e);
    if (connectedDevice && connectedDevice === dev) { /* an old connection must not close a replacement */
      const timeout = /^timeout/.test(e.message);
      disconnect();
      sayK(timeout ? "noreply" : "error", timeout ? "" : e.message);
    }
  } finally {
    connecting = false;
    $("connect").disabled = false;
  }
}

function disconnect(reasonKey = "disconnected") {
  samplesLeave();                                   /* the Samples tab goes: so do the input and the preview */
  if (dev) {
    dev.link.close();
    dev.input.onmidimessage = null;
  }
  dev = null;
  resetBusy();
  needReload = false;
  renderPanels();
  renderMixer();
  renderSysinfo();
  renderLive();
  renderLib();
  renderBank();
  renderPreferences(true);
  $("version").textContent = "";
  setLabel($("connect"), t("connect"));
  sayK(reasonKey);
}

function onState(e) {
  const p = e.port;
  if (!p || !UNIT_PORT.test(p.name || "")) return;   /* ((2.0.1, #50) the names connect() takes) */
  if (dev && p.state === "disconnected" && (p.id === dev.input.id || p.id === dev.output.id)) {
    disconnect("lost");
  } else if (!dev && wantConnected && p.state === "connected" && p.type === "output") {
    clearTimeout(onState.tm);                       /* the device came back: reconnect */
    onState.tm = setTimeout(() => { if (!dev && wantConnected) connect(); }, 800);
  }
}

/* the whole connect sequence */
async function load(d) {
  const releaseBusy = beginBusy();
  try {
    /* the first frame after opening the port can be lost: a few tries */
    d.info = parse[CMD.INFO](await sessionRequest(d, req.info(), { timeout: 500, retries: 3 }));
    $("version").textContent = d.info.version;
    const total = d.info.pcount + d.info.gcount;
    for (let i = 0; i < d.info.pcount; i++) { sayK("reading", `${i + 1}/${total}`); d.pdesc[i] = await getDescOrNull(0, i, d); }
    for (let i = 0; i < d.info.gcount; i++) { sayK("reading", `${d.info.pcount + i + 1}/${total}`); d.gdesc[i] = await getDescOrNull(1, i, d); }
    d.titles = [];
    for (let e = 0; e < d.info.nengines; e++) {
      const r = parse[CMD.NAMES](await sessionRequest(d, req.names(e)));
      d.names[e] = r.names;
      d.titles[e] = r.titles;
    }
    for (let k = 0; k < 4; k++) {                    /* PROJECT op 2: is the slot used */
      try { d.slotUsed[k] = parse[CMD.PROJECT](await sessionRequest(d, req.project(2, k))).used; }
      catch (e) { if (e.message === "closed") throw e; }
    }
    try { await smpInfo(d); }
    catch (e) { if (e.message === "closed") throw e; d.smp = null; }   /* older firmware, or no flash */
    d.keys = paramKeys(d.pdesc, d.info.pe0, d.info.pcount);
    await libAdopt(d);
    assertSession(d);
    if (d.info.ntrk) d.sel = parse[CMD.TRACK](await sessionRequest(d, req.track())).sel;   /* v3: the selected track */
    d.dump = await getDump(d);
    buildUI();
    renderPanels();
    await loadStepsIfShown(d);
    if (d.info.ntrk) await readMixer(d, true);
    await readMenu(d);                               /* ((Skiff W3) the MENU settings) */
    await readTransport(d);                          /* ((Skiff W3) the transport, the projects' names) */
    await readProj(d);
    /* protocol v2: live pushes and the user bank; older firmware: DUMP polling, no bank */
    const rqd = (r, o) => sessionRequest(d, r, o);
    d.watch = await startWatch(rqd);
    d.v4 = d.watch === 3;                           /* TRACK_PARAM / TRACK_CHANGED */
    if (d.watch) {
      sayK("readingBank");
      try { d.bank = await bank.list((r, o) => sessionRequest(d, r, { ...o, quiet: true })); }
      catch (e) { if (e.message === "closed") throw e; d.bank = null; }
    }

    renderBank();

}
async function getDescOrNull(s, i, d = dev) { try { return await getDesc(s, i, d); } catch (e) { if (e.message === "closed") throw e; return null; } }

/* rebuilds the controls only when the engine or its parameters changed (a slider being dragged survives) */
async function rereadEngineDesc(d = dev) {
  assertSession(d);

                                                           user's samples, which change) */

function modDst(d, txt) {

  const e = m && dev && dev.pdesc[dev.info.pe0 + +m[1] - 1];

}

function buildGroups() {
  ctl.clear();
  dev.built = dev.dump.engine;
  /* Sound: the selected track's parameters; Sequencer: its pattern settings; Settings: globals */
  const groups = { groups: [], seqgroups: [], setgroups: [] };
  const { info } = dev;
  if (knownLayout(info)) {
    for (const g of LAYOUT(info.pe0)) {
      const div = el("div", { class: "group" }, el("h2", { ic: HEAD_IC[g.t], text: g.engine ? `EDIT ${info.engines[dev.dump.engine] || ""}` : g.t }));
      if (g.mod != null) {                          /* MOD: slot number, SRC, DST, AMT in one row */
        for (let k = 0; k < 4; k++) {
          const r = [0, 1, 2].map((j) => paramRow(0, g.mod + 3 * k + j));
          if (r.some((x) => !x)) continue;
          const row = el("div", { class: "row modrow" }, el("span", { text: String(k + 1) }), r[0].children[1], r[1].children[1],
            r[2].children[1], r[2].children[2]);
          for (let j = 0; j < 3; j++) ctl.get(key(0, g.mod + 3 * k + j)).row = row;   /* (the push highlight) */
          div.append(row);
        }
        groups.groups.push(div);
        continue;
      }
      for (const [title, s, ids] of g.pages) {
        const rows = ids.map((id) => paramRow(s, id)).filter(Boolean);
        if (!rows.length) continue;
        const tt = g.engine && (dev.titles[dev.dump.engine] || [])[g.pages.findIndex((x) => x[0] === title)];
        if (g.pages.length > 1) div.append(el("h3", { ic: PAGE_IC[tt || title], text: tt || title }));
        div.append(...rows);
      }
      groups[g.tab || "groups"].push(div);
    }
  } else {
    /* unknown firmware layout: everything in id order */
    const a = el("div", { class: "group" }, el("h2", { ic: HEAD_IC.INSTRUMENT, text: "INSTRUMENT" }), el("p", { class: "dim", text: t("layout") }));
    const b = el("div", { class: "group" }, el("h2", { ic: HEAD_IC.EDIT, text: "EDIT" }));
    const c = el("div", { class: "group" }, el("h2", { ic: HEAD_IC.GLOBAL, text: "GLOBAL" }));
    for (let i = 0; i < info.pcount; i++) { const r = paramRow(0, i); if (r) (i >= info.pe0 ? b : a).append(r); }
    for (let i = 0; i < info.gcount; i++) { const r = paramRow(1, i); if (r) c.append(r); }
    groups.groups.push(a, b);
    groups.setgroups.push(c);
  }
  if (kitShown()) groups.groups.push(kitGroup());     /* ((Skiff W3)) */
  for (const [id, divs] of Object.entries(groups)) $(id).replaceChildren(...divs);
  if (kitShown()) { renderKit(); op(() => readKit()); }
}

function paramRow(s, id) {
  const d = s ? dev.gdesc[id] : dev.pdesc[id];
  if (!visible(d) || (s === 1 && G_SKIP.has(d.label))) return null;
  const k = key(s, id);
  let input;
  if (d.fmt === F.ENUM || d.fmt === F.NOTE || d.fmt === F.ONOFF) {
    const wave = RICH_SELECT && d.fmt === F.ENUM && /^WAVE2?$/.test(d.label);
    input = el("select", { class: wave ? "wave" : null });
    /* the closed select shows a copy of the chosen option (icon span included), not its bare text */
    if (wave) input.append(el("button", {}, el("selectedcontent")));
    for (const v of enumShown(d)) {                 /* (note divisions longest first: #48) */
      const [txt] = fmtValue(d, v);
      const name = d.fmt === F.ENUM && d.names[v - d.min] == null ? String(v) : modDst(d, txt);
      const alias = d.fmt === F.ENUM && aliasOf(d.names, v - d.min) !== v - d.min;   /* shown when set, not offered */
      input.append(el("option", { value: v, ic: wave && WAVE_IC[name], hidden: alias }, name));
    }
    input.addEventListener("change", () => userSet(s, id, +input.value, true));
  } else {
    input = el("input", { type: "range", min: d.min, max: d.max, step: 1 });
    input.addEventListener("pointerdown", () => { dragging = k; });
    input.addEventListener("input", () => userSet(s, id, +input.value, false));
    input.addEventListener("change", () => userSet(s, id, +input.value, true));
    input.addEventListener("dblclick", () => { input.value = d.def; userSet(s, id, d.def, true); });
    /* fine adjust: wheel over the focused slider, Shift+arrows in steps of 10 (plain arrows are native) */
    const nudge = (dv) => {
      const nv = Math.max(d.min, Math.min(d.max, +input.value + dv));
      if (nv !== +input.value) { input.value = String(nv); userSet(s, id, nv, true); }
    };
    let acc = 0;
    input.addEventListener("wheel", (e) => {
      if (document.activeElement !== input) return;
      e.preventDefault();
      acc += (e.deltaMode === 1 ? 33 : 1) * (Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? -e.deltaY : e.deltaX);
      const n = Math.trunc(acc / 50);
      if (n) { acc -= n * 50; nudge(n * (e.shiftKey ? 10 : 1)); }
    }, { passive: false });
    input.addEventListener("keydown", (e) => {
      const dir = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
      if (!dir || !e.shiftKey) return;
      e.preventDefault();
      nudge(dir * 10);
    });
  }
  input.title = d.label;
  const out = el("span", { class: "v" });
  const row = el("div", { class: "row" }, el("span", { text: d.label }), input, out);
  ctl.set(k, { input, out, desc: d, scope: s, id, row });
  showValue(k, s ? dev.dump.g[id] : dev.dump.p[id], true);
  return row;
}

/* (Skiff 1.3) ENV SYNC on (P_ESYNC): ATTACK DECAY RELEASE are note values of the tempo (params.c ESYNC_NAMES: 0..127 split
   evenly over them) */
const ESYNC_NAMES = ["0", "1/64T", "1/64", "1/32T", "1/64D", "1/32", "1/16T", "1/32D", "1/16", "1/8T", "1/16D", "1/8", "1/4T", "1/8D",
  "1/4", "1/2T", "1/4D", "1/2", "1/1T", "1/2D", "1/1", "1/1D", "2BAR", "3BAR", "4BAR"];
const eSyncOn = (c) => !c.scope && [1, 2, 4].includes(c.id) && !!dev && !!dev.info && dev.info.pe0 >= 127 && !!dev.dump &&
  !!dev.dump.p[P_ESYNC];
function showValue(k, v, force) {
  const c = ctl.get(k);
  if (!c || v == null) return;
  let [txt0, unit] = fmtValue(c.desc, v), txt = modDst(c.desc, txt0);
  if (eSyncOn(c)) { txt = ESYNC_NAMES[(v & 127) * ESYNC_NAMES.length >> 7]; unit = ""; }   /* ((1.3) ENV SYNC: a note value) */
  c.out.textContent = unit ? `${txt} ${unit}` : txt;
  if (c.input.type === "range") c.input.setAttribute("aria-valuetext", c.out.textContent);   /* ((Skiff W6) read as shown) */
  if (force || !touched(k)) c.input.value = String(v);

/* the user is working on this control: polling and pushes must not move it */
function touched(k) {
  const c = ctl.get(k), st = sets.get(k);

  if (c && c.input.tagName === "SELECT" && document.activeElement === c.input) return true;
  if (st && performance.now() - st.last < 600) return true;
  return !!dev && (dev.link.hasQueued(k) || (!!dev.link.cur && dev.link.cur.key === k));
}

window.addEventListener("pointerup", () => { if (dragging) { const k = dragging; dragging = null; const c = ctl.get(k); if (c) userSet(c.scope, c.id, +c.input.value, true); } });
window.addEventListener("pointercancel", () => { dragging = null; });

/* SET as fast as the device answers: one SET per control in flight and at most one queued, which
   always carries the latest value (Link coalesces by key), so a drag never builds a backlog */
function userSet(s, id, v, final) {
  if (!dev) return;
  const k = key(s, id);
  (s ? dev.dump.g : dev.dump.p)[id] = v;
  showValue(k, v, false);
  mixFromDump();
  let st = sets.get(k);
  if (!st) sets.set(k, (st = { last: 0, sent: null }));
  st.last = performance.now();

  sendSet(s, id, k);

async function sendSet(s, id, k) {
  if (!dev) return;
  const st = sets.get(k);
  const v = (s ? dev.dump.g : dev.dump.p)[id];
  st.sent = v;
  try {
    const r = parse[CMD.SET](await rq(req.set(s, id, v), { key: k }));
    if (dev && dragging !== k && st.sent === v && !dev.link.hasQueued(k)) {   /* the device's value after clamping */
      (s ? dev.dump.g : dev.dump.p)[id] = r.value;
      showValue(k, r.value, false);
      mixFromDump();

/* Complete archives remain on this computer; no project or sample is uploaded to a server. */
function renderBackup() {
  const caps = dev?.info?.backupCaps || 0;
  $("backup-export").disabled = !(caps & 1);
  $("backup-import").disabled = !(caps & 2);
  $("backup-help").textContent = t(caps & 1 ? "backupHelp" : "backupOld");
}
const backupModule = () => import("./fm1backup.js");
/* ((2.0, Tier B 10) web/conv/conv.js's report: a line for each object it changes (the pattern chunks counted) */
function convLines(report) {
  const name = (id) => id === 0 ? t("backupObjMusic") : id <= 5 ? t("backupObjSlot").replace("{n}", "ABCD"[id - 2])
    : id <= 7 ? t("backupObjPresets").replace("{n}", id === 6 ? "1-16" : "17-32") : id === 8 ? t("backupObjFm6") : t("backupObjPatches");
  const lines = [], pats = report.filter((x) => x.id >= 16 && x.id < 32 && x.what !== "kept").length;
  for (const x of report)
    if ((x.what !== "kept" || x.note) && x.id !== 1 && (x.id < 16 || x.id > 31))
      lines.push(`${name(x.id)}: ${x.what.startsWith("refused") ? t("backupRefused") : x.what.startsWith("kept as")
        ? t("backupFull") : x.what === "kept" ? x.was : `${x.was} -> ${x.now}`}${x.note ? `\n  ${t("backupNote")}${x.note}` : ""}`);
  if (pats) lines.push(t("backupObjPatterns"));
  return lines.join("\n");
}
const backupProgress = (done, total) => sayK("backupWorking", `${Math.round(done / Math.max(1, total) * 100)}%`);
$("backup-export").addEventListener("click", () => op(async () => {
  const d = dev;
  if (!(d?.info?.backupCaps & 1)) return;
  const { captureBackup } = await backupModule();
  assertSession(d);
  const file = await captureBackup((r, o) => sessionRequest(d, r, o), d.info.version, backupProgress);
  assertSession(d);
  download(`Skiff-backup-${new Date().toISOString().slice(0, 10)}.json`, file);
  sayK("backupDone");
}));
$("backup-import").addEventListener("click", () => { if (dev?.info?.backupCaps & 2) $("backup-file").click(); });
$("backup-file").addEventListener("change", () => {
  const file = $("backup-file").files[0], d = dev; $("backup-file").value = "";
  if (!file || !(d?.info?.backupCaps & 2)) return;
  op(async () => {
    if (file.size > 600000) throw new Error("Backup file too large");
    const { readBackup, restoreBackup } = await backupModule();
    let archive = readBackup(await file.text()), say = "", only = null; assertSession(d);
    if (d.info.song2) {                              /* ((2.0, Tier B 10) a unit of 2.0: what it can't read, converted first */
      const { loadConverter } = await import("./conv/conv.js");
      const r = (await loadConverter(new URL("conv/conv.wasm", location.href).href)).convert(archive);
      const bad = r.report.filter((x) => x.what.startsWith("refused")).map((x) => x.id);
      assertSession(d);
      if (r.writeBack.length || r.report.some((x) => x.what !== "kept" || x.note)) {
        archive = r.archive; say = t("backupConvert").replace("{list}", convLines(r.report)) + "\n\n";
      }
      if (bad.length) only = archive.objects.map((o) => o.id).filter((id) => !bad.includes(id));   /* (a damaged one: the
                                                     unit refuses it too, so it is left out, not the restore stopped) */
    }
    if (!confirm(say + t("backupConfirm"))) return;
    await restoreBackup((r, o) => sessionRequest(d, r, o), archive, backupProgress, only);
    await load(d); sayK("backupRestored");
  });
});
